<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter';font-weight:600;src:url('fonts/Inter-600.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:700;src:url('fonts/Inter-700.woff2') format('woff2');}
@font-face{font-family:'Playfair Display';font-weight:800;src:url('fonts/PlayfairDisplay-800.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:'Inter',sans-serif;color:#f2e8d1;
 background:radial-gradient(ellipse 760px 520px at 88% 112%,rgba(176,118,28,.34),transparent 62%),
            radial-gradient(ellipse 900px 600px at 18% -10%,rgba(90,64,22,.22),transparent 60%),
            linear-gradient(160deg,#0d0c0a 0%,#070707 55%,#030303 100%)}
body:after{content:"";position:absolute;inset:0;background-image:url(noise.png);opacity:.06;mix-blend-mode:overlay}
.frame{position:absolute;inset:22px;border:1px solid rgba(212,165,55,.28);border-radius:6px}
.mark{position:absolute;left:50%;bottom:-40px;width:900px;transform:translateX(-50%);opacity:.06}
.wing{position:absolute;top:0;bottom:0;width:285px;}
.wing.l{left:0;background:linear-gradient(90deg,rgba(176,118,28,.10),transparent)}
.wing.r{right:0;background:linear-gradient(270deg,rgba(176,118,28,.10),transparent)}
.col{position:absolute;left:300px;width:600px;top:30px;bottom:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.logo{position:static;width:320px;margin-bottom:18px}
.eb{position:static;font:700 15px/1 'Inter';letter-spacing:.22em;text-transform:uppercase;color:#e0b04a;margin-bottom:14px}
.t{position:static;width:540px;font:800 52px/1.1 'Playfair Display',serif;color:#fbf6ea;text-wrap:balance;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.calc{margin-top:22px;display:none;align-items:center;gap:10px;padding:10px 18px;border:1.5px solid #e0b04a;border-radius:999px;background:rgba(224,176,74,.10);font:700 14px/1 'Inter';letter-spacing:.14em;text-transform:uppercase;color:#f3c15a}
.calc svg{width:16px;height:16px}
body.has-calc .calc{display:inline-flex}
.u{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:600 17px/1 'Inter';letter-spacing:.06em;color:rgba(242,232,209,.7)}
</style></head><body>
<div class="frame"></div><div class="wing l"></div><div class="wing r"></div>
<img class="mark" src="mark.png" alt="">
<div class="col"><img class="logo" src="logo.png" alt=""><div class="eb" id="eb"></div><div class="t" id="t"></div>
<div class="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h3.5"/></svg>Calculator included</div></div>
<div class="u">stlhomejourney.com</div>
</body></html>
