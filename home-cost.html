<style>
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
}

/* ── COST GUIDE SCOPED STYLES ── */
  /* ── DEMO MODE ── */
body.demo-mode { pointer-events: none; overflow: hidden; }
body.demo-mode .hc-tab-nav { pointer-events: none; }
body.demo-mode .hc-addr-bar { display: none; }
body.demo-mode #hc-map      { display: none; }

.hc-demo-pulse {
  animation: hc-pulse 0.6s ease-in-out 3;
  border-color: var(--gold) !important;
  background: var(--gold-soft) !important;
}

@keyframes hc-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,204,77,.5); }
  50%  { box-shadow: 0 0 0 8px rgba(255,204,77,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,204,77,0); }
}

.hc-demo-selected {
  border-color: var(--warn) !important;
  background: rgba(232,160,32,.06) !important;
}
.hc-demo-selected .hc-rc-check {
  background: var(--warn) !important;
  border-color: var(--warn) !important;
  color: #080808 !important;
}
.hc-wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 60px; }

/* Mode bar */
.hc-mode-bar {
  background: var(--surface);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.hc-mode-label { font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); flex-shrink: 0; }
.hc-mode-toggle { display: flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.hc-mode-btn {
  padding: 7px 16px;
  border: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--text-faint);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.hc-mode-btn.active { background: var(--gold); color: #080808; }
.hc-mode-desc { font-size: 11px; color: var(--text-dim); line-height: 1.4; flex: 1; }

/* Address bar */
.hc-addr-bar {
  background: var(--surface);
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
}
.hc-addr-input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text-strong);
  outline: none;
  transition: border-color .18s ease;
}
.hc-addr-input:focus { border-color: var(--gold-line); }
.hc-addr-input::placeholder { color: var(--text-faint); }
.hc-addr-btn {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s ease;
}
.hc-btn-map { background: var(--gold); color: #080808; }
.hc-btn-map:hover { opacity: .9; }
.hc-btn-geo { background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--line-2); }
.hc-btn-geo:hover { border-color: var(--gold-line); color: var(--text-strong); }

#hc-map { height: 150px; width: 100%; border-bottom: 1px solid var(--line); }

/* Tab nav */
.hc-tab-nav {
  background: rgba(5,5,5,.97);
  border-bottom: 1px solid var(--line);
  display: flex;
  overflow-x: auto;
}
.hc-tab-nav::-webkit-scrollbar { display: none; }
.hc-tnav-btn {
  flex: 1;
  min-width: 72px;
  padding: 11px 8px;
  border: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--text-faint);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
  white-space: nowrap;
  text-align: center;
  position: relative;
}
.hc-tnav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.hc-tnav-btn:hover:not(.active) { color: var(--text-soft); }
.hc-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  background: var(--warn);
  color: #080808;
  font-size: 9px;
  font-weight: 800;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
}
.hc-badge.visible { display: flex; }

.hc-panel { display: none; }
.hc-panel.active { display: block; }

/* Context box */
.hc-context {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--gold);
  border-radius: 0 10px 10px 0;
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--text-soft);
  line-height: 1.72;
}
.hc-context strong { color: var(--gold); }
.hc-context.seller { border-left-color: var(--green); }
.hc-context.seller strong { color: var(--green); }

/* Section header */
.hc-sec-hd {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

/* House diagram */
.hc-house-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  position: relative;
}
.hc-house-title {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 8px;
  text-align: center;
}
.hc-house-svg-wrap { position: relative; width: 100%; max-width: 460px; margin: 0 auto; }
#hc-house-svg { width: 100%; height: auto; display: block; }

.hs-zone { cursor: pointer; transition: opacity .15s ease; }
.hs-zone:hover .hs-fill { opacity: .35; }
.hs-zone.flagged .hs-fill { opacity: .5; }
.hs-fill { opacity: 0; transition: opacity .2s ease; }
.hs-label { pointer-events: none; font-family: var(--font-sans); font-size: 9px; fill: white; opacity: 0; transition: opacity .2s ease; }
.hs-zone:hover .hs-label, .hs-zone.flagged .hs-label { opacity: 1; }
.hs-dot { r: 5; fill: var(--warn); stroke: var(--bg); stroke-width: 1.5; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.hs-zone.flagged .hs-dot { opacity: 1; }

/* House legend */
.hc-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
.hc-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--text-dim);
  cursor: pointer;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 8px;
  transition: border-color .15s ease;
}
.hc-legend-item:hover { border-color: var(--line-2); }
.hc-legend-item.flagged { border-color: var(--warn); background: rgba(232,160,32,.08); color: var(--warn); }
.hc-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Repair cards */
.hc-cat-hdr {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-faint);
  margin: 12px 0 6px;
  padding-left: 2px;
}
.hc-repair-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: border-color .18s ease, background .18s ease;
}
.hc-repair-card:hover { border-color: var(--line-2); }
.hc-repair-card.flagged { border-color: var(--warn); background: rgba(232,160,32,.06); }
.hc-repair-card.flagged.major { border-color: var(--red); background: var(--red-soft); }
.hc-rc-left { flex: 1; }
.hc-rc-name { font-family: var(--font-serif); font-size: 14px; font-weight: 600; color: var(--text-strong); margin-bottom: 2px; }
.hc-rc-range { font-size: 11px; color: var(--text-dim); }
.hc-rc-stl { font-size: 10px; color: var(--warn); margin-top: 2px; font-style: italic; }
.hc-rc-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-left: 10px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  transition: background .15s ease, border-color .15s ease;
}
.hc-repair-card.flagged .hc-rc-check { background: var(--warn); border-color: var(--warn); color: #080808; }
.hc-repair-card.flagged.major .hc-rc-check { background: var(--red); border-color: var(--red); color: #ffffff; }

/* Measure tab */
.hc-sf-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.hc-sf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.hc-sf-field label { display: block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); margin-bottom: 5px; }
.hc-sf-field input { width: 100%; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; font-family: var(--font-sans); font-size: 14px; color: var(--text-strong); outline: none; transition: border-color .18s ease; }
.hc-sf-field input:focus { border-color: var(--gold-line); }
.hc-sf-field input::placeholder { color: var(--text-faint); }

.hc-wt-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); margin-bottom: 8px; }
.hc-wt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.hc-wt-card { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; transition: border-color .18s ease, background .18s ease; }
.hc-wt-card.selected { border-color: var(--gold); background: var(--gold-soft); }
.hc-wt-card:hover:not(.selected) { border-color: var(--line-2); }
.hc-wt-name { font-family: var(--font-serif); font-size: 13px; font-weight: 600; color: var(--text-strong); }
.hc-wt-rate { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

.hc-sf-result { background: var(--surface-2); border: 1px solid var(--gold-line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: none; }
.hc-sf-result.visible { display: block; }
.hc-sfr-val { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--gold); }
.hc-sfr-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

.hc-sf-list-item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.hc-sfl-name { color: var(--text-soft); flex: 1; }
.hc-sfl-cost { font-family: var(--font-serif); font-size: 13px; font-weight: 600; color: var(--warn); margin: 0 8px; }
.hc-sfl-remove { background: transparent; border: none; color: var(--text-faint); cursor: pointer; font-size: 14px; transition: color .15s ease; }
.hc-sfl-remove:hover { color: var(--red); }

.hc-sf-subtotal { background: var(--surface-2); border: 1px solid var(--gold-line); border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.hc-sfs-label { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }
.hc-sfs-val { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--gold); }

.hc-merge-btn { width: 100%; margin-top: 8px; padding: 10px; border: 1px solid var(--green-line); background: transparent; border-radius: 8px; font-family: var(--font-sans); font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--green); cursor: pointer; transition: background .15s ease; }
.hc-merge-btn:hover { background: var(--green-soft); }
.hc-merge-btn:disabled { opacity: .4; cursor: not-allowed; }
.hc-merge-note { font-size: 10px; color: var(--text-faint); text-align: center; margin-top: 6px; line-height: 1.55; }

/* Report tab */
.hc-report-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.hc-rc-header { background: var(--surface-2); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.hc-rc-title { font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.hc-rc-subtitle { font-size: 10px; color: var(--text-dim); }
.hc-rc-empty { padding: 16px; text-align: center; font-size: 12px; color: var(--text-faint); line-height: 1.65; }
.hc-rc-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
.hc-rc-row:last-child { border-bottom: none; }
.hc-rcr-name { color: var(--text-soft); flex: 1; }
.hc-rcr-cost { font-family: var(--font-serif); font-size: 13px; font-weight: 600; color: var(--warn); margin: 0 8px; }
.hc-rcr-del { background: transparent; border: none; color: var(--text-faint); cursor: pointer; font-size: 13px; transition: color .15s ease; }
.hc-rcr-del:hover { color: var(--red); }

.hc-total-row { background: var(--surface-2); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line-2); }
.hc-rct-label { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }
.hc-rct-val { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--warn); }
.hc-rct-val.danger { color: var(--red); }

.hc-grand-total {
  background: var(--gold-soft);
  border: 1px solid var(--gold-line);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.hc-gt-label { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 2px; }
.hc-gt-val { font-family: var(--font-serif); font-size: 28px; font-weight: 700; color: var(--gold); line-height: 1; }
.hc-gt-sub { font-size: 10px; color: var(--text-faint); margin-top: 3px; }
.hc-gt-midpoint { font-family: var(--font-serif); font-size: 18px; font-weight: 700; color: var(--text-strong); }
.hc-gt-mid-label { font-size: 10px; color: var(--text-faint); }

.hc-insight {
  border-radius: 0 10px 10px 0;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 12px;
  line-height: 1.72;
  border-left: 3px solid;
}
.hc-insight-buyer { background: rgba(232,160,32,.06); border-color: var(--warn); color: var(--text-soft); }
.hc-insight-buyer strong { color: var(--warn); }
.hc-insight-seller { background: var(--green-soft); border-color: var(--green); color: var(--text-soft); }
.hc-insight-seller strong { color: var(--green); }

/* Send tab */
.hc-send-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.hc-send-field { margin-bottom: 12px; }
.hc-send-field label { display: block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); margin-bottom: 5px; }
.hc-send-field input { width: 100%; padding: 11px 12px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; font-family: var(--font-sans); font-size: 14px; color: var(--text-strong); outline: none; transition: border-color .18s ease; }
.hc-send-field input:focus { border-color: var(--gold-line); }
.hc-send-field input::placeholder { color: var(--text-faint); }
.hc-cc-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
.hc-cc-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold); flex-shrink: 0; }

.hc-cta-box { background: var(--surface); border: 1px solid var(--gold-line); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 12px; }
.hc-cta-title { font-family: var(--font-serif); font-size: 18px; font-weight: 700; color: var(--text-strong); margin-bottom: 6px; }
.hc-cta-sub { font-size: 12px; color: var(--text-dim); line-height: 1.65; margin-bottom: 12px; }

.hc-btn-primary { width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--gold); color: #080808; font-family: var(--font-sans); font-size: 13px; font-weight: 800; letter-spacing: .04em; cursor: pointer; margin-bottom: 8px; transition: opacity .15s ease; text-decoration: none; display: block; text-align: center; }
.hc-btn-primary:hover { opacity: .92; }
.hc-btn-secondary { width: 100%; padding: 11px; border: 1px solid var(--line-2); border-radius: 10px; background: transparent; color: var(--text-soft); font-family: var(--font-sans); font-size: 12px; font-weight: 700; cursor: pointer; margin-bottom: 6px; transition: border-color .18s ease, color .18s ease; }
.hc-btn-secondary:hover { border-color: var(--gold-line); color: var(--text-strong); }

.hc-data-source { font-size: 10px; color: var(--text-faint); text-align: center; line-height: 1.6; padding: 8px 0; }

@media (max-width: 480px) {
  .hc-sf-grid { grid-template-columns: 1fr; }
  .hc-grand-total { flex-direction: column; }
}

.george-card{background:linear-gradient(135deg,rgba(255,204,77,0.04) 0%,rgba(255,204,77,0.01) 100%);border:1px solid rgba(255,204,77,.34);border-radius:16px;padding:28px;margin:48px 0;display:flex;gap:24px;align-items:flex-start;}

.george-card-photo img{width:100%;height:100%;object-fit:cover;}
.george-card-content{flex:1;min-width:0;}
.george-card-name{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:rgba(255,255,255,.96);margin-bottom:4px;}
.george-card-title{font-size:0.82rem;color:rgba(255,255,255,.54);margin-bottom:14px;line-height:1.5;}
.george-card-line{font-size:0.92rem;color:rgba(255,255,255,.72);line-height:1.68;margin-bottom:18px;}
.george-card-btns{display:flex;gap:10px;flex-wrap:wrap;}
.george-btn-p{display:inline-flex;align-items:center;gap:6px;background:#ffcc4d;color:#080808;font-weight:700;font-size:13px;letter-spacing:0.03em;padding:11px 20px;border-radius:8px;text-decoration:none;transition:transform 0.1s;}
.george-btn-p:hover{transform:translateY(-1px);}
.george-btn-s{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,204,77,.34);color:#ffcc4d;font-weight:600;font-size:13px;letter-spacing:0.03em;padding:10px 19px;border-radius:8px;text-decoration:none;transition:background 0.18s;}
.george-btn-s:hover{background:rgba(255,204,77,.18);}

  // ── MAP ───────────────────────────────────────────────────────
  function initMap() {
    if (_map) return;
    var mapEl = _container.querySelector('#hc-map');
    if (!mapEl || typeof L === 'undefined') return;
    _map = L.map(mapEl).setView([38.627, -90.199], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', attribution: ''
    }).addTo(_map);
    setTimeout(function() { if (_map) _map.invalidateSize(); }, 200);
  }

  function geoLocate() {
    if (!navigator.geolocation) { alert('Geolocation not available.'); return; }
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      if (_map) {
        _map.setView([lat, lng], 16);
        if (_marker) _map.removeLayer(_marker);
        _marker = L.marker([lat, lng]).addTo(_map);
      }
    }, function() { alert('Could not get location. Please enter the address manually.'); });
  }

  function searchAddress() {
    var addr = _container.querySelector('#hc-addr');
    if (!addr || !addr.value.trim()) return;
    fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(addr.value.trim()) + '&limit=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.length && _map) {
          var lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
          _map.setView([lat, lng], 16);
          if (_marker) _map.removeLayer(_marker);
          _marker = L.marker([lat, lng]).addTo(_map);
        } else { alert('Address not found. Try adding "St. Louis, MO" to your search.'); }

    var sf = l * w;

    var wt = WORK_TYPES.filter(function(x) { return x.id === wtId; })[0] || WORK_TYPES[0];
    var costLow = Math.round(sf * wt.low);
    var costHigh = Math.round(sf * wt.high);
    sfLast = { id: 'sf-' + wtId + '-' + Date.now(), name: wt.name + ' — ' + sf.toLocaleString() + ' SF', low: costLow, high: costHigh };
    var valEl = _container.querySelector('#hc-sfr-val');

    if (valEl) valEl.textContent = '$' + costLow.toLocaleString() + ' – $' + costHigh.toLocaleString();

    if (sendBtn)  sendBtn.addEventListener('click',  sendReport);
    if (copyBtn)  copyBtn.addEventListener('click',  copyReport);
    if (gotoSend) gotoSend.addEventListener('click', function() { switchTab('send'); });
  }

  // ── PUBLIC ────────────────────────────────────────────────────
  return {
    mount: function (container) {
      _container   = container;
      mode         = 'buyer';
      repairReport = [];
      sfReport     = [];
      sfMerged     = false;
      sfLast       = null;
      container.innerHTML = buildHTML();
      bindAll();
      buildLegend();
      buildRepairList();
      buildWorkTypes();
      updateBadges();
      // Init map after render
      setTimeout(function() {
        if (typeof L !== 'undefined') initMap();
      }, 100);
    },
    unmount: function () {
      if (_map) { _map.remove(); _map = null; _marker = null; }
      if (_container) _container.innerHTML = '';
      _container = null;
    }
  };
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="zip-data.js"></script>
<script src="resources.js"></script>
<script src="shared.js"></script>

<script>
/* ── DEMO MODE ─────────────────────────────────────────────── */
(function () {
  var isDemo = window.location.search.indexOf('demo=1') !== -1;
  if (!isDemo) return;

  document.body.classList.add('demo-mode');

  var _stageH  = 420;
  var _drawerH = 200;

  /* Receive config and action commands from parent */
  /* Poll until #hc-repair-list has children, then signal parent the iframe is ready */
  (function () {
    var poll = setInterval(function () {
      var list = document.getElementById('hc-repair-list');
      if (list && list.children.length > 0) {
        clearInterval(poll);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ hcDemoReady: true }, '*');
        }
      }
    }, 80);
  })();

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || !msg.hcDemo) return;

    if (msg.action === 'init') {
      _stageH  = msg.stageHeight  || 420;
      _drawerH = msg.drawerHeight || 200;
      return;
    }

    if (msg.action === 'scroll-to') {
      _scrollToItem(msg.itemId);
      return;
    }

    if (msg.action === 'select-item') {
      _selectItem(msg.itemId);
      return;
    }

    if (msg.action === 'switch-tab') {
      _switchTab(msg.tab);
      return;
    }

    if (msg.action === 'scroll-top') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (msg.action === 'highlight-badge') {
      _highlightBadge(msg.tab);
      return;
    }

    if (msg.action === 'measure-demo') {
      _runMeasureDemo(msg.length, msg.width, msg.workType);
      return;
    }
    if (msg.action === 'check-cc') {
  var cb = document.getElementById('hc-ccMe');
  if (cb) {
    cb.checked = true;
    cb.classList.add('hc-demo-pulse');
    setTimeout(function () { cb.classList.remove('hc-demo-pulse'); }, 2000);
  }
  return;
}
  });

  function _scrollToItem(itemId) {
    var el = document.getElementById('hc-rc-' + itemId);
    if (!el) return;
    var elTop    = el.getBoundingClientRect().top + window.scrollY;
    var elHeight = el.offsetHeight;
    var visibleH = _stageH - _drawerH;
    var target   = elTop - (visibleH / 2) + (elHeight / 2);
    window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
  }

  function _selectItem(itemId) {
  var el = document.getElementById('hc-rc-' + itemId);
  if (!el) return;
  el.classList.add('hc-demo-pulse');
  setTimeout(function () {
    el.classList.remove('hc-demo-pulse');
    el.click();
  }, 1800);
}

  function _switchTab(tab) {
    var btns = document.querySelectorAll('.hc-tnav-btn');
    var panels = document.querySelectorAll('.hc-panel');
    Array.prototype.forEach.call(btns, function (b) { b.classList.remove('active'); });
    Array.prototype.forEach.call(panels, function (p) { p.classList.remove('active'); });
    var btn   = document.getElementById('tnav-' + tab);
    var panel = document.getElementById('hc-panel-' + tab);
    if (btn)   btn.classList.add('active');
    if (panel) panel.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function _highlightBadge(tab) {
    var badge = document.getElementById('badge-' + tab);
    if (!badge) return;
    badge.classList.add('visible', 'hc-demo-pulse');
    setTimeout(function () { badge.classList.remove('hc-demo-pulse'); }, 2000);
  }

  function _runMeasureDemo(len, wid, workType) {
    var lEl = document.getElementById('hc-sf-length');
    var wEl = document.getElementById('hc-sf-width');
    if (lEl) _typeValue(lEl, String(len));
    setTimeout(function () {
      if (wEl) _typeValue(wEl, String(wid));
      setTimeout(function () {
        /* Select work type */
        var cards = document.querySelectorAll('.hc-wt-card');
        Array.prototype.forEach.call(cards, function (c) {
          c.classList.remove('selected');
          if (c.id === 'hc-wt-' + workType) c.classList.add('selected', 'hc-demo-pulse');
        });
        setTimeout(function () {
          /* Fire calculate */
          var calcBtn = document.getElementById('hc-calc-btn');
          if (calcBtn) {
            calcBtn.classList.add('hc-demo-pulse');
            setTimeout(function () {
              calcBtn.classList.remove('hc-demo-pulse');
              if (window.TOOL_MODULES && window.TOOL_MODULES['home-cost']) {
                /* Call calculate directly */
                var sfL = parseFloat(lEl.value) || 0;
                var sfW = parseFloat(wEl.value) || 0;
                var sf  = sfL * sfW;
                var wt  = [
                  {id:'paint',low:2,high:4},{id:'drywall',low:5,high:10},
                  {id:'flooring',low:6,high:15},{id:'demo',low:2,high:6},
                  {id:'tile',low:8,high:20},{id:'concrete',low:6,high:12}
                ].filter(function(x){return x.id===workType;})[0] || {low:2,high:4};
                var resEl = document.getElementById('hc-sf-result');
                var valEl = document.getElementById('hc-sfr-val');
                var subEl = document.getElementById('hc-sfr-sub');
                if (valEl) valEl.textContent = '$'+(sf*wt.low).toLocaleString()+' – $'+(sf*wt.high).toLocaleString();
                if (subEl) subEl.textContent = sf.toLocaleString()+' SF × $'+wt.low+'–$'+wt.high+'/SF';
                if (resEl) resEl.classList.add('visible');
              }
            }, 800);
          }
        }, 1500);
      }, 1500);
    }, 1500);
  }

  function _typeValue(el, val) {
    el.value = '';
    var i = 0;
    var iv = setInterval(function () {
      el.value = val.slice(0, i + 1);
      i++;
      if (i >= val.length) clearInterval(iv);
    }, 120);
  }

})();
</script>

<script>
  
(function () {
  function mountStandalone() {
    if (!window.TOOL_MODULES || !window.TOOL_MODULES['home-cost']) { setTimeout(mountStandalone, 30); return; }
    if (!document.getElementById('tool-panel-body')) {
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:var(--bg);min-height:100vh;';
      document.body.appendChild(wrapper);
      window.TOOL_MODULES['home-cost'].mount(wrapper);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountStandalone);
  else mountStandalone();
})();
</script>
