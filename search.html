<style>
:root{--bg:#050505;--surface:#101010;--line:#242424;--line-2:#303030;--text-strong:rgba(255,255,255,.96);--text:rgba(255,255,255,.88);--text-soft:rgba(255,255,255,.72);--text-dim:rgba(255,255,255,.54);--text-faint:rgba(255,255,255,.34);--gold:#ffcc4d;--gold-soft:rgba(255,204,77,.18);--gold-line:rgba(255,204,77,.34);--font-serif:"Playfair Display",Georgia,serif;--font-sans:"Inter",-apple-system,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.6;overflow-x:hidden;}
a{color:var(--gold);text-decoration:none;}
.art-hdr{background:rgba(5,5,5,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;}
.art-hdr-l{display:flex;align-items:center;gap:10px;min-width:0;}
.art-hdr-ico{width:32px;height:32px;flex-shrink:0;}
.art-hdr-ico img{width:100%;height:100%;object-fit:contain;}
.art-hdr-t{font-family:var(--font-serif);font-size:14px;font-weight:600;letter-spacing:.03em;color:var(--text-strong);line-height:1.05;}
.art-hdr-t span{color:var(--gold);}
.art-hdr-name{font-size:10px;font-weight:600;color:var(--text-soft);letter-spacing:.04em;margin-top:2px;}
.art-hdr-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.art-hdr-btn{font-size:10px;font-weight:700;letter-spacing:.05em;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-soft);background:rgba(255,255,255,.02);white-space:nowrap;}
.art-hdr-btn.gold{border-color:var(--gold-line);color:var(--gold);background:var(--gold-soft);}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 80px;}
h1{font-family:var(--font-serif);font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;color:var(--text-strong);line-height:1.15;margin-bottom:6px;}
.lede{color:var(--text-dim);font-size:.95rem;margin-bottom:18px;}
.box{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--gold-line);border-radius:14px;padding:6px 6px 6px 14px;}
.box svg{flex-shrink:0;color:var(--gold);}
.box input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text-strong);font:500 1rem var(--font-sans);padding:10px 0;}
.box input::placeholder{color:var(--text-faint);}
.box button{flex-shrink:0;border:0;border-radius:10px;background:var(--gold);color:#080808;font:700 13px var(--font-sans);padding:10px 14px;cursor:pointer;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
.chip{font:600 12px var(--font-sans);color:var(--text-soft);background:rgba(255,255,255,.03);border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;cursor:pointer;}
.chip:hover{border-color:var(--gold-line);color:var(--gold);}
.recs{margin:22px 0 6px;border:1px solid var(--gold-line);border-radius:14px;background:linear-gradient(135deg,rgba(255,204,77,.06),rgba(255,204,77,.01));padding:16px 18px;}
[hidden]{display:none !important;}
.recs-hd{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.rec{display:block;padding:10px 0;border-top:1px solid rgba(255,204,77,.14);}
.rec:first-of-type{border-top:0;}
.rec-t{font-weight:700;color:var(--text-strong);font-size:.98rem;line-height:1.35;}
.rec-d{color:var(--text-dim);font-size:.85rem;margin-top:2px;}
.status{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:26px 0 4px;}
.status.empty{font-size:.95rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text-soft);}
.res{padding:16px 0;border-top:1px solid var(--line);}
.res-sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:3px;}
.res-t{font-family:var(--font-serif);font-size:1.12rem;font-weight:700;color:var(--text-strong);line-height:1.3;display:block;}
.res-t:hover{color:var(--gold);}
.res-x{color:var(--text-soft);font-size:.9rem;margin-top:5px;overflow-wrap:anywhere;}
mark{background:var(--gold-soft);color:var(--text-strong);border-radius:3px;padding:0 2px;}
.subs{margin-top:8px;display:grid;gap:6px;}
.sub{display:block;border-left:2px solid var(--gold-line);padding:2px 0 2px 12px;}
.sub-t{color:var(--gold);font-weight:600;font-size:.88rem;line-height:1.35;}
.sub-x{color:var(--text-dim);font-size:.82rem;overflow-wrap:anywhere;}
.more{display:block;margin:18px auto 0;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--text-soft);font:600 13px var(--font-sans);padding:10px 18px;cursor:pointer;}
.foot{border-top:1px solid var(--line);padding:28px 16px;text-align:center;font-size:11px;color:var(--text-faint);line-height:1.8;}
@media(max-width:600px){.art-hdr-name{display:none;}}
</style>
</head>
<body>
<header class="art-hdr">
  <a class="art-hdr-l" href="/" aria-label="STL Home Journey home">
    <picture><source media="(max-width:600px)" srcset="/assets/brand/stlhj-key-mark-silver.webp" width="258" height="90"><img class="hdr-wordmark" src="/assets/brand/stlhj-key-logo-silver.webp" alt="STL Home Journey" width="388" height="174" style="display:block;height:clamp(30px,7.4vw,58px);width:auto;max-width:none;"></picture>
  </a>
  <nav class="art-hdr-nav">
    <a class="art-hdr-btn" href="/articles/">Guides</a>
    <a class="art-hdr-btn gold" href="/">Journey</a>
  </nav>
</header>

<main class="wrap">
  <h1>Search the site</h1>
  <p class="lede">Every guide, neighborhood, school district and ZIP code page, with 2026 sales data and the questions buyers and sellers actually ask.</p>
  <form class="box" id="ss-form" role="search" action="/search" method="get">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label for="ss-q" style="position:absolute;left:-9999px;">Search</label>
    <input id="ss-q" name="q" type="search" autocomplete="off" placeholder="Search guides, areas, ZIP codes">
    <button type="submit">Search</button>
  </form>
  <div class="chips" id="ss-chips" aria-label="Popular topics">
    <button class="chip" type="button">Who pays the commission</button>
    <button class="chip" type="button">How much to offer</button>
    <button class="chip" type="button">Home inspection</button>
    <button class="chip" type="button">MHDC down payment</button>
    <button class="chip" type="button">VA loan</button>
    <button class="chip" type="button">Property taxes</button>
    <button class="chip" type="button">Downsizing</button>
    <button class="chip" type="button">Cash offer</button>
  </div>

  <section class="recs" id="ss-recs" hidden aria-labelledby="ss-recs-hd">
    <div class="recs-hd" id="ss-recs-hd">Start here</div>
    <div id="ss-recs-list"></div>
  </section>
  <p class="status" id="ss-status" hidden aria-live="polite"></p>
  <div id="ss-results"></div>
  <button class="more" id="ss-more" type="button" hidden>Show more results</button>
</main>

</body>
</html>
