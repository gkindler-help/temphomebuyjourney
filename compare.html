<style>
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
}

/* ── COMPARE TOOL SCOPED STYLES ── */
.cmp-wrap { max-width: 700px; margin: 0 auto; padding: 16px 14px 60px; }

/* Tab nav */
.cmp-tab-nav {
  background: rgba(5,5,5,.97);
  border-bottom: 1px solid var(--line);
  display: flex;
  overflow-x: auto;
  flex-shrink: 0;
}
.cmp-tab-nav::-webkit-scrollbar { display: none; }

.cmp-tab-btn {
  flex: 1;
  min-width: 90px;
  padding: 11px 8px;
  border: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--text-faint);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
  white-space: nowrap;
  text-align: center;
}
.cmp-tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.cmp-tab-btn:hover:not(.active) { color: var(--text-soft); }

.cmp-panel { display: none; }
.cmp-panel.active { display: block; }

/* Property cards */
.cmp-props-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 14px; }
.cmp-props-scroll::-webkit-scrollbar { height: 3px; }
.cmp-props-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }

.cmp-props-row { display: flex; gap: 10px; min-width: max-content; padding-bottom: 4px; }

.cmp-prop-card {
  width: 200px;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  transition: border-color .18s ease;
}
.cmp-prop-card:focus-within { border-color: var(--gold-line); }

.cmp-pc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.cmp-pc-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
  color: #080808;
}

.cmp-pc-remove {
  background: transparent;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  transition: color .15s ease;
}
.cmp-pc-remove:hover { color: var(--red); }

.cmp-field { margin-bottom: 8px; }

.cmp-field label {
  display: block;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-faint);
  margin-bottom: 4px;
}

.cmp-field select,
.cmp-field input[type="number"],
.cmp-field input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-strong);
  outline: none;
  transition: border-color .18s ease;
}

.cmp-field select:focus,
.cmp-field input:focus { border-color: var(--gold-line); }
.cmp-field select option { background: var(--surface-2); color: var(--text-strong); }
.cmp-field input::placeholder { color: var(--text-faint); }

.cmp-add-btn {
  background: transparent;
  border: 1px dashed var(--line-2);
  border-radius: 12px;
  padding: 12px;
  width: 160px;
  flex-shrink: 0;
  cursor: pointer;
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: border-color .18s ease, color .18s ease;
}
.cmp-add-btn:hover { border-color: var(--gold-line); color: var(--gold); }
.cmp-add-btn .plus { font-size: 22px; line-height: 1; }

/* Loan settings */
.cmp-settings {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
}
.cmp-settings-title {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
}
.cmp-settings-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.cmp-sf label {
  display: block;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.cmp-sf input {
  width: 100%;
  padding: 9px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text-strong);
  outline: none;
  transition: border-color .18s ease;
}
.cmp-sf input:focus { border-color: var(--gold-line); }

/* Primary CTA button */
.cmp-btn-run {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  border: none;
  border-radius: 10px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #080808;
  cursor: pointer;
  transition: opacity .15s ease;
}
.cmp-btn-run:hover { opacity: .92; }

/* Comparison table */
.cmp-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.cmp-table-wrap::-webkit-scrollbar { height: 3px; }
.cmp-table-wrap::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }

.cmp-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 480px;
}
.cmp-table th {
  background: var(--surface-2);
  padding: 10px 12px;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.cmp-table th.p-col { min-width: 110px; text-align: right; }
.cmp-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: middle; }
.cmp-table td.p-col { text-align: right; }
.cmp-table tr:last-child td { border-bottom: none; }
.cmp-table tr.cmp-section-hdr td {
  background: rgba(255,255,255,.02);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 7px 12px;
}
.cmp-table tr.cmp-grand-row td {
  background: rgba(255,204,77,.04);
  border-top: 1px solid var(--gold-line);
}
.ct-label { color: var(--text-soft); }
.ct-val {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-strong);
}
.ct-val.gold  { color: var(--gold); }
.ct-val.green { color: var(--green); }
.ct-val.warn  { color: var(--warn); }
.ct-val.red   { color: var(--red); }
.ct-val.lg    { font-size: 18px; }
.cmp-winner-cell { background: rgba(93,202,165,.06) !important; }
.cmp-winner-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-left: 4px;
  vertical-align: middle;
}

/* What to look for */
.cmp-wtlf-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.cmp-wtlf-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 6px;
}
.cmp-wtlf-zip {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
}
.cmp-wtlf-city { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.cmp-wtlf-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
}
.cmp-badge-hot  { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line); }
.cmp-badge-warm { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold-line); }
.cmp-badge-slow { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-line); }

.cmp-wtlf-items { display: flex; flex-direction: column; gap: 6px; }
.cmp-wtlf-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  background: var(--surface-2);
  border-radius: 8px;
  border-left: 3px solid;
}
.cmp-wi-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.cmp-wi-text { font-size: 11px; color: var(--text-soft); line-height: 1.65; }
.cmp-wi-text strong { color: var(--text-strong); }

/* Conclusion */
.cmp-conclusion-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.cmp-cc-title {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}

.cmp-winner-banner {
  background: var(--green-soft);
  border: 1px solid var(--green-line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.cmp-wb-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.cmp-wb-winner {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 6px;
}
.cmp-wb-reason { font-size: 12px; color: var(--text-soft); line-height: 1.72; }

.cmp-cs-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 6px;
  border-left: 3px solid transparent;
}
.cmp-cs-label { color: var(--text-dim); }
.cmp-cs-val { font-family: var(--font-serif); font-size: 14px; font-weight: 700; color: var(--text-strong); }

.cmp-savings-box {
  background: var(--gold-soft);
  border: 1px solid var(--gold-line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  text-align: center;
}
.cmp-sb-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.cmp-sb-val {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 700;
  color: var(--gold);
}
.cmp-sb-sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

.cmp-cta-box {
  background: var(--surface);
  border: 1px solid var(--gold-line);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
}
.cmp-cta-title {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-strong);
  margin-bottom: 6px;
}
.cmp-cta-sub { font-size: 12px; color: var(--text-dim); line-height: 1.65; margin-bottom: 12px; }

.cmp-btn-call {
  display: block;
  background: var(--gold);
  border: none;
  padding: 13px;
  width: 100%;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
  color: #080808;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: opacity .15s ease;
}
.cmp-btn-call:hover { opacity: .92; }

.cmp-btn-secondary {
  display: block;
  padding: 11px;
  width: 100%;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  background: transparent;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-soft);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  margin-top: 8px;
  transition: border-color .18s ease, color .18s ease;
}
.cmp-btn-secondary:hover { border-color: var(--gold-line); color: var(--text-strong); }

/* Micro-education triggers */
.cmp-me-trigger {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--warn);
  border-radius: 0 10px 10px 0;
  padding: 10px 12px;
  margin-bottom: 10px;
  animation: cmpMeIn .25s ease;
}
@keyframes cmpMeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.cmp-me-trigger.me-danger { border-left-color: var(--red); }
.cmp-me-trigger.me-info   { border-left-color: var(--green); }
.cmp-me-trigger.me-tip    { border-left-color: rgba(138,176,208,.6); }
.cmp-me-trigger.me-caution { border-left-color: var(--warn); }
.cmp-me-header { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.cmp-me-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.cmp-me-short { font-size: 12px; color: var(--text-soft); line-height: 1.55; flex: 1; }
.cmp-me-short strong { color: var(--text-strong); }
.cmp-me-expand { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); flex-shrink: 0; margin-top: 2px; white-space: nowrap; }
.cmp-me-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-soft); line-height: 1.72; }
.cmp-me-trigger.open .cmp-me-detail { display: block; }
.cmp-me-detail strong { color: var(--text-strong); }
.cmp-me-block { margin-bottom: 14px; }

/* Era selector */
.cmp-era-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.cmp-esc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cmp-esc-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
  color: #080808;
}
.cmp-esc-title { font-family: var(--font-serif); font-size: 15px; font-weight: 600; color: var(--text-strong); }
.cmp-esc-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.cmp-era-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp-era-tile {
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
  text-align: center;
}
.cmp-era-tile:hover { border-color: var(--gold-line); }
.cmp-era-tile.selected { border-color: var(--gold); background: var(--gold-soft); }
.cmp-et-era { font-family: var(--font-serif); font-size: 16px; font-weight: 700; color: var(--text-strong); margin-bottom: 2px; }
.cmp-et-label { font-size: 10px; color: var(--text-dim); line-height: 1.4; }
.cmp-et-risk { font-size: 9px; margin-top: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.risk-high { color: var(--red); }
.risk-med  { color: var(--warn); }
.risk-low  { color: var(--green); }

/* Checklist items */
.cmp-cl-prop-block { margin-bottom: 22px; }
.cmp-cl-prop-header {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px 12px 0 0;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: none;
}
.cmp-clph-left { display: flex; align-items: center; gap: 10px; }
.cmp-clph-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; color: #080808; }
.cmp-clph-title { font-family: var(--font-serif); font-size: 15px; font-weight: 600; color: var(--text-strong); }
.cmp-clph-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.cmp-cl-era-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--gold-soft);
  border: 1px solid var(--gold-line);
  color: var(--gold);
}

.cmp-cl-items { background: var(--surface); border: 1px solid var(--line); border-radius: 0 0 12px 12px; overflow: hidden; }
.cmp-cl-item { border-bottom: 1px solid var(--line); }
.cmp-cl-item:last-child { border-bottom: none; }
.cmp-cl-item-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background .12s ease;
}
.cmp-cl-item-header:hover { background: rgba(255,255,255,.02); }
.cmp-cl-priority { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pri-critical { background: var(--red); }
.pri-high     { background: var(--warn); }
.pri-medium   { background: var(--gold); }
.pri-low      { background: var(--text-faint); }
.cmp-cl-item-text { flex: 1; }
.cmp-cl-item-name { font-family: var(--font-serif); font-size: 13px; font-weight: 600; color: var(--text-strong); margin-bottom: 2px; }
.cmp-cl-item-desc { font-size: 11px; color: var(--text-dim); line-height: 1.55; }
.cmp-cl-item-expand { font-size: 12px; color: var(--text-faint); transition: transform .2s ease; flex-shrink: 0; }
.cmp-cl-item.open .cmp-cl-item-expand { transform: rotate(180deg); }

.cmp-cl-status-wrap {
  display: none;
  padding: 10px 14px 14px 32px;
  border-top: 1px solid var(--line);
  background: rgba(0,0,0,.1);
}
.cmp-cl-item.open .cmp-cl-status-wrap { display: block; }
.cmp-cl-status-prompt { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.55; }

.cmp-cl-status-tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.cmp-cst {
  padding: 8px 6px;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  border: 1px solid transparent;
  transition: border-color .15s ease, background .15s ease;
}
.cmp-cst-ok   { background: var(--green-soft); border-color: rgba(93,202,165,.2); }
.cmp-cst-ok:hover, .cmp-cst-ok.selected   { border-color: var(--green); }
.cmp-cst-warn { background: rgba(232,160,32,.06); border-color: rgba(232,160,32,.2); }
.cmp-cst-warn:hover, .cmp-cst-warn.selected { border-color: var(--warn); background: rgba(232,160,32,.16); }
.cmp-cst-flag { background: var(--red-soft); border-color: rgba(224,136,128,.2); }
.cmp-cst-flag:hover, .cmp-cst-flag.selected { border-color: var(--red); }
.cmp-cst-icon { font-size: 16px; margin-bottom: 2px; }
.cmp-cst-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.cmp-cst-ok   .cmp-cst-label { color: var(--green); }
.cmp-cst-warn .cmp-cst-label { color: var(--warn); }
.cmp-cst-flag .cmp-cst-label { color: var(--red); }

.cmp-cl-budget {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 11px;
  line-height: 1.72;
  display: none;
}

<body class="tool-page">
<div id="app"></div>

<script>
window.SUPPRESS_DASHBOARD = true;  /* Loaded in iframe, don't render dashboard */
window.CHAPTER_NUM   = 0;
window.CHAPTER_LABEL = 'Compare Properties';
window.PREV_FILE     = 'index.html';
window.SCENES        = [];

window.TOOL_MODULES = window.TOOL_MODULES || {};
window.TOOL_MODULES['compare'] = (function () {
  'use strict';

  var PROP_COLORS = ['#ffcc4d','#5dcaa5','#8ab0d0','#e05555','#b0a0d8'];
  var PROP_LABELS = ['①','②','③','④','⑤'];
  var MAX_PROPS   = 5;
  var LS_KEY      = 'stl_checklist_v1';

  var properties   = [];
  var lastResults  = null;
  var checklistState = {};
  var _container   = null;
  var ZIP_OPTS     = '';

  var ERAS = [
    {id:'pre1950', label:'Before 1950',    sub:'1900s–1949',          risk:'High Risk Era',    riskCls:'risk-high'},
    {id:'e1950',   label:'1950 – 1979',    sub:'Post-war to Carter',  risk:'High Risk Era',    riskCls:'risk-high'},
    {id:'e1980',   label:'1980 – 1999',    sub:'Reagan to Y2K',       risk:'Medium Risk',      riskCls:'risk-med'},
    {id:'e2000',   label:'2000 – Present', sub:'Modern construction', risk:'Lower Risk',       riskCls:'risk-low'},
  ];

  var CHECKLIST_ITEMS = [
    {id:'knob-tube',  era:['pre1950'],county:'all',priority:'critical',
     name:'Knob & Tube Wiring',
     desc:'Standard in homes built before 1950. Ungrounded, no insulation on conductors, fire risk if covered with insulation or overloaded.',
     prompt:'Look for ceramic knobs on joists in the basement and attic, cloth-wrapped wires.',
     budget:{low:8000,high:18000,negotiate:'Full rewire cost is negotiable as a price reduction or seller credit — get a licensed electrician estimate first.',maintain:'Many insurers will not issue a policy on active knob-and-tube. Get this resolved before closing.'}},
    {id:'lead-pipes', era:['pre1950'],county:'all',priority:'critical',
     name:'Lead Supply Pipes',
     desc:'Lead pipes were standard before 1950. Even partial lead service lines are a health concern. St. Louis City has an active replacement program but it only covers the street to the meter.',
     prompt:'Check under the kitchen sink and at the main shutoff — lead pipes are dull gray and soft enough to scratch with a key.',
     budget:{low:2000,high:8000,negotiate:'Seller should credit or replace. Do not accept "it has been like this for 50 years" as an answer.',maintain:'Filter does not fully solve this. Budget for full replacement within 2 years.'}},
    {id:'galvanized',era:['pre1950','e1950'],county:'all',priority:'high',
     name:'Galvanized Steel Pipes',
     desc:'Corrodes from the inside out. Reduces water pressure over time and eventually fails. Common in pre-1960 construction.',
     prompt:'Look at exposed pipes in basement — galvanized is dull gray with visible rust at joints. Copper is orange-brown. PVC is white.',
     budget:{low:3000,high:12000,negotiate:'Factor into offer as a deferred maintenance item. Get a plumber to assess how much original galvanized remains.',maintain:'Budget for full replacement within 5 years if significant galvanized is present.'}},
    {id:'lead-paint',era:['pre1950','e1950'],county:'all',priority:'high',
     name:'Lead Paint',
     desc:'Any home built before 1978 may have lead paint. Pre-1950 homes almost certainly do. Intact lead paint is manageable — deteriorating lead paint is a hazard.',
     prompt:'Check window sills, doors, and trim for chipping or chalking paint.',
     budget:{low:1000,high:6000,negotiate:'Sellers must disclose known lead paint. Lead testing ($300–500) before making an offer is worth it.',maintain:'Encapsulation is acceptable. Full abatement is only required if the paint is deteriorating.'}},
    {id:'plaster-walls',era:['pre1950'],county:'all',priority:'medium',
     name:'Plaster Walls',
     desc:'Plaster is durable but cracks over time with foundation movement and settling.',
     prompt:'Look for hairline cracks, especially around door frames and windows. Horizontal cracks are more serious than vertical.',
     budget:{low:500,high:4000,negotiate:'Cosmetic only unless cracks are wide or structural.',maintain:'Budget $500–$1,500 for cosmetic plaster repairs over the first few years.'}},
    {id:'radiator-heat',era:['pre1950'],county:'all',priority:'medium',
     name:'Radiator / Boiler Heat System',
     desc:'Can be efficient if maintained. Issues include leaks, uneven heat, and expensive boiler replacement.',
     prompt:'Ask seller when boiler was last serviced. Check for rust staining around radiator valves.',
     budget:{low:4000,high:12000,negotiate:'Boiler replacement is a negotiating point if near end of life (20+ years).',maintain:'Annual service call ($150–$300) extends boiler life significantly.'}},
    {id:'sewer-scope',era:['pre1950','e1950','e1980'],county:'St. Louis City',priority:'critical',
     name:'Sewer Lateral — Scope Required',
     desc:'Pre-1990 city homes frequently have original clay tile sewer laterals. Tree root infiltration and pipe collapse are common.',
     prompt:'A sewer scope ($300–400) is non-negotiable on any pre-1990 city home.',
     budget:{low:3000,high:15000,negotiate:'A failed sewer scope is one of the strongest negotiating positions you can have.',maintain:'Re-check every 5–7 years in older city homes.'}},
    {id:'tuckpointing',era:['pre1950','e1950','e1980'],county:'St. Louis City',priority:'high',
     name:'Tuckpointing — Brick Mortar',
     desc:'Neglected mortar joints allow water infiltration, causing interior damage and eventually structural deterioration.',
     prompt:'Stand back and look at the mortar joints on the exterior. Failed mortar appears recessed, crumbling, or missing entirely.',
     budget:{low:2000,high:20000,negotiate:'Spot tuckpointing ($2K–$5K) vs. full façade ($10K–$20K). Get a mason to scope it before negotiating.',maintain:'Well-maintained tuckpointing lasts 25–30 years.'}},
    {id:'fed-pacific',era:['e1950'],county:'all',priority:'critical',
     name:'Federal Pacific / Zinsco Panel',
     desc:'Documented failure rate — breakers do not trip under overload. Many insurers require replacement before issuing a policy.',
     prompt:'Federal Pacific panels say "Stab-Lok" on the breakers. Zinsco panels have colorful breakers.',
     budget:{low:2500,high:8000,negotiate:'Panel replacement is a legitimate ask. Get a licensed electrician quote.',maintain:'Do not delay this. This is a safety issue, not a cosmetic one.'}},
    {id:'asbestos',era:['e1950'],county:'all',priority:'high',
     name:'Asbestos — Floor Tile, Insulation, Ductwork',
     desc:'Common in 1950s–1970s construction: 9x9 floor tiles, pipe insulation, duct wrap, popcorn ceilings.',
     prompt:'9x9 inch floor tiles are almost certainly asbestos. Do not disturb without testing.',
     budget:{low:500,high:10000,negotiate:'Testing is $200–$400. Intact asbestos can be encapsulated. Disturbed asbestos requires abatement.',maintain:'Intact asbestos is not an immediate health hazard. The risk comes from disturbing it.'}},
    {id:'hvac-age',era:['e1950','e1980'],county:'all',priority:'high',
     name:'HVAC System — Age & Condition',
     desc:'HVAC systems have a 15–20 year useful life. Any system from the 1980s or early 1990s is at or past end of life.',
     prompt:'Look for the manufacturing date on the furnace and AC compressor data plate.',
     budget:{low:6500,high:14000,negotiate:'An aging HVAC is a legitimate negotiating point. Get an HVAC contractor to assess.',maintain:'Annual service ($150–$250) extends life.'}},
    {id:'poly-pipe',era:['e1980'],county:'all',priority:'critical',
     name:'Polybutylene Pipes',
     desc:'Used 1978–1995. Degrades from chlorine in municipal water and fails without warning.',
     prompt:'Poly pipe is gray, blue, or black plastic tubing. Check under sinks and at the water heater.',
     budget:{low:4000,high:15000,negotiate:'Full replacement is a reasonable demand or price offset. Do not accept partial replacement.',maintain:'There is no safe way to maintain poly pipe indefinitely. Plan for full replacement.'}},
    {id:'roof',era:['e1980','e1950'],county:'all',priority:'high',
     name:'Roof — Age & Condition',
     desc:'Asphalt shingles last 20–25 years. A home from the 1980s–1990s with an original roof is overdue.',
     prompt:'Look for curling, cupping, or missing shingles. Granules in gutters indicate deterioration.',
     budget:{low:8000,high:18000,negotiate:'Roof condition is one of the most common negotiating points. Inspection report with remaining useful life is your documentation.',maintain:'Annual inspections ($150) and prompt repair of missing shingles can extend life 3–5 years.'}},
    {id:'septic',era:['pre1950','e1950','e1980','e2000'],county:'Jefferson County',priority:'high',
     name:'Septic System — Verification Required',
     desc:'Many Jefferson County properties outside Arnold and Festus city limits use septic systems.',
     prompt:'Ask the listing agent directly: is this on city sewer or septic?',
     budget:{low:5000,high:25000,negotiate:'A septic inspection ($300–$500) should be a condition of any offer.',maintain:'Pump every 3–5 years ($300–$500). Budget for full replacement after 25–30 years.'}},
    {id:'sump-pump',era:['e1950','e1980','e2000'],county:'all',priority:'medium',
     name:'Sump Pump & Basement Moisture',
     desc:'St. Louis clay soils create significant hydrostatic pressure. Basement moisture is the most common major defect.',
     prompt:'Check the sump pit — is there a pump? Battery backup? Look for efflorescence on basement walls.',
     budget:{low:300,high:30000,negotiate:'Active water intrusion or a failed drain tile system is a major negotiating point.',maintain:'Sump pump replacement ($300–$800) every 7–10 years. Battery backup strongly recommended.'}},
    {id:'water-htr',era:['e2000'],county:'all',priority:'medium',
     name:'Water Heater — Age Check',
     desc:'Standard water heaters last 8–12 years. An original 2005–2015 water heater may be at or past end of life.',
     prompt:'Check the data plate for manufacture date.',
     budget:{low:800,high:3500,negotiate:'A water heater at or past useful life is a minor negotiating point — often easier to ask for a $1,000 credit.',maintain:'Annual flushing extends life.'}},
    {id:'hvac-2000',era:['e2000'],county:'all',priority:'medium',
     name:'HVAC — Service History',
     desc:'A home with no documented service history likely has a clogged filter, dirty coils, and reduced efficiency.',
     prompt:'Ask seller for HVAC service records. Check the filter. Look for rust on the indoor air handler.',
     budget:{low:150,high:14000,negotiate:'An unmaintained system may have shortened its life — get an HVAC assessment.',maintain:'Annual service ($150–$250) is the single best investment for HVAC longevity.'}},
  ];

  function loadChecklistState() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e) { return {}; } }
  function saveChecklistState(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e) {} }

  function fmt$(n) { return n < 0 ? '-$' + Math.abs(Math.round(n)).toLocaleString() : '$' + Math.round(n).toLocaleString(); }
  function fmtK(n) { return '$' + Math.round(n/1000) + 'K'; }

  function buildZipOpts() {
    if (!window.ZIP_DATA) return '<option value="">— Select zip —</option>';
    var entries = Object.keys(window.ZIP_DATA).map(function(zip) {
      return { zip: zip, city: window.ZIP_DATA[zip].city };
    }).sort(function(a,b) { return a.city < b.city ? -1 : 1; });
    return '<option value="">— Select zip —</option>' +
      entries.map(function(e) { return '<option value="' + e.zip + '">' + e.zip + ' — ' + e.city + '</option>'; }).join('');
  }

  function meTrigger(type, icon, short, detail) {
    var id = 'cme-' + Math.random().toString(36).slice(2, 8);
    return '<div class="cmp-me-trigger me-' + type + '" id="' + id + '">' +
      '<div class="cmp-me-header" data-meid="' + id + '">' +
        '<span class="cmp-me-icon">' + icon + '</span>' +
        '<span class="cmp-me-short">' + short + '</span>' +
        '<span class="cmp-me-expand">Learn More ▼</span>' +
      '</div>' +
      '<div class="cmp-me-detail">' + detail + '</div>' +
    '</div>';
  }

  function bindMeTriggers(el) {
    Array.prototype.forEach.call(el.querySelectorAll('.cmp-me-header'), function(hdr) {
      hdr.addEventListener('click', function() {
        var id = hdr.getAttribute('data-meid');
        var trigger = document.getElementById(id);
        if (!trigger) return;
        var open = trigger.classList.toggle('open');
        var exp = hdr.querySelector('.cmp-me-expand');
        if (exp) exp.textContent = open ? 'Close ▲' : 'Learn More ▼';
      });
    });
  }

  function buildHTML() {
    return (
      '<div class="cmp-tab-nav" id="cmp-tab-nav">' +
        '<button class="cmp-tab-btn active" id="tnav-setup"      data-tab="setup">⚙️ Setup</button>' +
        '<button class="cmp-tab-btn"        id="tnav-checklist"  data-tab="checklist">📋 Before You Go</button>' +
        '<button class="cmp-tab-btn"        id="tnav-table"      data-tab="table">📊 Comparison</button>' +
        '<button class="cmp-tab-btn"        id="tnav-look"       data-tab="look">🔍 What To Look For</button>' +
        '<button class="cmp-tab-btn"        id="tnav-conclusion" data-tab="conclusion">✅ Conclusion</button>' +
      '</div>' +

      '<div id="panel-setup" class="cmp-panel active"><div class="cmp-wrap">' +
        '<div class="tool-data-strip" style="margin-bottom:14px;">' +
          '<div class="tool-data-stat"><div class="tool-data-num">7,006</div><div class="tool-data-lbl">MLS Sales</div></div>' +
          '<div class="tool-data-stat"><div class="tool-data-num">79</div><div class="tool-data-lbl">ZIP Codes</div></div>' +
          '<div class="tool-data-stat"><div class="tool-data-num">2025–26</div><div class="tool-data-lbl">MARIS Data</div></div>' +
        '</div>' +
        '<p style="font-size:12px;color:var(--text-dim);margin-bottom:14px;line-height:1.65;">Add up to 5 properties. Select a zip code and the median price auto-fills — or enter your own. Choose a condition tier and the price updates to match what homes at that level actually sold for in this zip.</p>' +
        '<div class="cmp-props-scroll"><div class="cmp-props-row" id="props-row"></div></div>' +
        '<div class="cmp-settings">' +
          '<div class="cmp-settings-title">Loan Assumptions — Applied To All Properties</div>' +
          '<div class="cmp-settings-row">' +
            '<div class="cmp-sf"><label>Down Payment ($)</label><input type="number" id="down" value="15000" step="1000" min="0"></div>' +
            '<div class="cmp-sf"><label>Interest Rate (%)</label><input type="number" id="rate" value="6.75" step="0.125" min="3" max="12"></div>' +
            '<div class="cmp-sf"><label>Monthly Debts ($)</label><input type="number" id="debts" value="0" step="100" min="0"></div>' +
          '</div>' +
        '</div>' +
        '<button class="cmp-btn-run" id="btn-run-compare">Run Comparison →</button>' +
      '</div></div>' +

      '<div id="panel-checklist" class="cmp-panel"><div class="cmp-wrap">' +
        '<div id="checklist-era-prompt">' +
          '<div class="cmp-intro-box">' +
            '<div class="cmp-intro-title">Use This Before You Go</div>' +
            '<div class="cmp-intro-sub">This checklist is generated from the zip code and the age of each home. It tells you exactly what to look for — what these homes almost certainly have, what it will cost you, and whether to negotiate or budget for it.</div>' +
          '</div>' +
          '<div id="era-selectors"></div>' +
          '<button class="cmp-btn-run" id="btn-gen-checklist" style="display:none;">Generate My Checklist →</button>' +
        '</div>' +
        '<div id="checklist-output" style="display:none;"></div>' +
      '</div></div>' +

      '<div id="panel-table" class="cmp-panel"><div class="cmp-wrap">' +
        '<div id="table-empty" class="cmp-empty-state">Run the comparison from the Setup tab first.</div>' +
        '<div class="cmp-table-wrap" id="table-wrap" style="display:none;"><table class="cmp-table" id="compare-table"></table></div>' +
      '</div></div>' +

      '<div id="panel-look" class="cmp-panel"><div class="cmp-wrap">' +
        '<div id="look-empty" class="cmp-empty-state">Run the comparison from the Setup tab first.</div>' +
        '<div id="look-content"></div>' +
      '</div></div>' +

      '<div id="panel-conclusion" class="cmp-panel"><div class="cmp-wrap">' +
        '<div id="conclusion-empty" class="cmp-empty-state">Run the comparison from the Setup tab first.</div>' +
        '<div id="conclusion-content"></div>' +
      '</div></div>'
    );
  }

  function switchTab(tab) {
    if (!_container) return;
    _container.querySelectorAll('.cmp-panel').forEach(function(p) { p.classList.remove('active'); });
    _container.querySelectorAll('.cmp-tab-btn').forEach(function(b) { b.classList.remove('active'); });
    var panel = _container.querySelector('#panel-' + tab);
    var btn   = _container.querySelector('#tnav-' + tab);
    if (panel) panel.classList.add('active');
    if (btn)   btn.classList.add('active');
    if (tab === 'checklist') {
      var out = _container.querySelector('#checklist-output');
      if (!out || out.style.display !== 'block') buildEraSelectors();
    }
    if (typeof gtag === 'function') gtag('event', 'compare_tab_view', { tab: tab });
  }

  function addProperty() {
    if (properties.length >= MAX_PROPS) return;
    properties.push({ zip:'', price:'', cond:'', addr:'' });
    renderPropertyCards();
  }

  function removeProperty(idx) {
    properties.splice(idx, 1);
    renderPropertyCards();
  }

  function renderPropertyCards() {
    var row = _container.querySelector('#props-row');
    if (!row) return;
    row.innerHTML = '';

    properties.forEach(function(p, i) {
      var card = document.createElement('div');
      card.className = 'cmp-prop-card';
      card.innerHTML =
        '<div class="cmp-pc-top">' +
          '<div class="cmp-pc-num" style="background:' + PROP_COLORS[i] + ';">' + PROP_LABELS[i] + '</div>' +
          (i >= 2 ? '<button class="cmp-pc-remove" data-remove="' + i + '" title="Remove">✕</button>' : '<div></div>') +
        '</div>' +
        '<div class="cmp-field"><label>ZIP Code</label><select id="p-zip-' + i + '">' + ZIP_OPTS + '</select></div>' +
        '<div class="cmp-field"><label>Sale Price ($)</label><input type="number" id="p-price-' + i + '" placeholder="Median auto-fills" min="50000" step="5000"></div>' +
        '<div class="cmp-field"><label>Condition</label><select id="p-cond-' + i + '"><option value="">Any / Custom</option><option value="aisis">As-Is</option><option value="mid">Mid-Tier</option><option value="move">Move-In Ready</option></select></div>' +
        '<div class="cmp-field"><label>Address / Note</label><input type="text" id="p-addr-' + i + '" placeholder="Optional"></div>';
      row.appendChild(card);

      if (p.zip)   { var zEl = card.querySelector('#p-zip-'   + i); if (zEl) zEl.value = p.zip; }
      if (p.price) { var pEl = card.querySelector('#p-price-' + i); if (pEl) pEl.value = p.price; }
      if (p.cond)  { var cEl = card.querySelector('#p-cond-'  + i); if (cEl) cEl.value = p.cond; }
      if (p.addr)  { var aEl = card.querySelector('#p-addr-'  + i); if (aEl) aEl.value = p.addr; }

      card.querySelector('#p-zip-' + i).addEventListener('change', function() { onZipChange(i); });
      card.querySelector('#p-cond-' + i).addEventListener('change', function() { onCondChange(i); });
      var rem = card.querySelector('[data-remove]');
      if (rem) rem.addEventListener('click', function() { removeProperty(parseInt(rem.getAttribute('data-remove'))); });
    });

    if (properties.length < MAX_PROPS) {
      var btn = document.createElement('button');
      btn.className = 'cmp-add-btn';
      btn.innerHTML = '<div class="plus">+</div><div>Add Property</div>';
      btn.addEventListener('click', addProperty);
      row.appendChild(btn);
    }
  }

  function onZipChange(i) {
    var zipEl = _container.querySelector('#p-zip-' + i);
    if (!zipEl) return;
    var zip = zipEl.value;
    properties[i].zip = zip;
    if (!zip || !window.ZIP_DATA || !window.ZIP_DATA[zip]) return;
    var d = window.ZIP_DATA[zip];
    var priceEl = _container.querySelector('#p-price-' + i);

  function buildTable(results, down, rate) {
    var emptyEl = _container.querySelector('#table-empty');

    if (emptyEl) emptyEl.style.display = 'none';
    if (wrapEl)  wrapEl.style.display  = 'block';

    var n = results.length;

    function winIdx(vals, lowerBetter) {
      var best = lowerBetter ? Infinity : -Infinity, idx = -1;
      vals.forEach(function(v, i) {
        if (v === null || v === undefined) return;
        var num = parseFloat(String(v).replace(/[^0-9.-]/g,''));
        if (isNaN(num)) return;
        if (lowerBetter ? num < best : num > best) { best = num; idx = i; }
      });
      var unique = {};
      vals.forEach(function(v) { if (v !== null) unique[v] = 1; });
      return Object.keys(unique).length > 1 ? idx : -1;
    }

    var hdr = '<tr><th>Metric</th>' +

    '</tr>';

    function row(label, vals, clsFn, lowerBetter) {

        vals.map(function(v, i) {
          return '<td class="p-col' + (i === wi ? ' cmp-winner-cell' : '') + '">' +
            '<span class="ct-val ' + (clsFn ? clsFn(v, i) : '') + '">' + (v !== null ? v : '—') +
            (i === wi ? '<span class="cmp-winner-dot"></span>' : '') +
            '</span></td>';
        }).join('') + '</tr>';

    function section(label) {

    var rows = [
      section('Price & Monthly Cost'),
      row('Sale Price',    results.map(function(r) { return fmt$(r.price); }),   function() { return 'gold'; }),
      row('P&I /mo',       results.map(function(r) { return fmt$(r.m.pi); }),    null),
      row('Tax /mo',       results.map(function(r) { return fmt$(r.m.tax); }),   function(v,i) { return results[i].m.tax < 280 ? 'green' : 'warn'; }),
      row('Insurance /mo', results.map(function(r) { return fmt$(r.m.ins); }),   null),
      row('PMI /mo',       results.map(function(r) { return fmt$(r.m.pmi); }),   function(v) { return v === '$0' ? 'green' : 'warn'; }),
      '<tr class="cmp-grand-row"><td style="font-weight:600;color:var(--text-strong);">All-In /mo</td>' +
        results.map(function(r, i) {
          var allTotals = results.map(function(x) { return x.m.total; });
          var wi = winIdx(allTotals, true);
          var isMin = r.m.total === Math.min.apply(null, allTotals);
          return '<td class="p-col' + (i === wi ? ' cmp-winner-cell' : '') + '">' +
            '<span class="ct-val lg" style="color:' + (isMin ? 'var(--green)' : 'var(--warn)') + ';">' +
            fmt$(r.m.total) + (i === wi ? '<span class="cmp-winner-dot"></span>' : '') + '</span></td>';
        }).join('') + '</tr>',

      section('Market Competition'),
      row('First Weekend Rate', results.map(function(r) { return r.d.fw + '%'; }),
        function(v,i) { var fw=results[i].d.fw; return fw>=50?'red':fw>=35?'warn':'green'; }),
      row('Avg Days On Market', results.map(function(r) { return r.d.dom + 'd'; }),
        function(v,i) { var dom=results[i].d.dom; return dom>20?'green':dom>10?'warn':'red'; }, false),
      row('% Sold Above List',  results.map(function(r) { return r.d.above + '%'; }),
        function(v,i) { return results[i].d.above < 50 ? 'green' : 'warn'; }),
      row('Sale/List Ratio',    results.map(function(r) { return r.d.splp + '%'; }), null),

      section('Tax & School'),
      row('Tax Rate',       results.map(function(r) { return (r.taxRate*100).toFixed(2)+'%'; }),
        function(v,i) { return results[i].taxRate <= 0.0092 ? 'green' : ''; }),
      row('Monthly Tax',    results.map(function(r) { return fmt$(r.m.tax); }),
        function(v,i) { return results[i].m.tax < 260 ? 'green' : 'warn'; }),
      row('County',         results.map(function(r) { return r.county; }),   null, false),
      row('School District',results.map(function(r) { return r.district || '—'; }), null, false),

    } else if (d.fw < 30) {
      flags.push({ icon:'💰', color:'var(--green)',
        title:'Negotiating Room',
        text: 'At ' + d.fw + '% first weekend rate and ' + d.dom + ' average days, sellers here are more open to negotiation. A strong inspection report gives you leverage. Do not skip it.' });
    }

    if (price < 150000) {
      flags.push({ icon:'🔴', color:'var(--red)',
        title:'Sub-$150K — Inspect Everything',
        text: 'Homes at this price point often have deferred maintenance that sellers cannot afford to fix. Budget for HVAC, roof, plumbing, and electrical issues. The inspection is not optional here — it is the most important $400 you will spend.' });

    }

        title:'Jefferson County Tax Advantage',
        text: 'Tax rate here is ' + (taxRate*100).toFixed(2) + '% — lower than St. Louis County. On this price point that saves you ' + fmt$(Math.round((price*(0.0114-taxRate))/12)) + '/month vs. a comparable St. Louis County address.' });
    }
    if (county === 'St. Charles County') {
      flags.push({ icon:'💵', color:'var(--green)',
        title:'St. Charles County Tax Advantage',
        text: 'Lowest tax rate in the metro at ' + (taxRate*100).toFixed(2) + '%. On this price point that saves ' + fmt$(Math.round((price*(0.0114-taxRate))/12)) + '/month vs. St. Louis County.' });
    }
    if (d.above >= 70) {

    var fpZips = { '63125':1,'63123':1,'63031':1,'63033':1,'63116':1,'63109':1,'63104':1,'63118':1 };
    if (fpZips[zip]) {
      flags.push({ icon:'⚡', color:'var(--red)',

        text: 'Homes in this zip were commonly built in the 1950s–1970s. Federal Pacific Stab-Lok panels have a documented failure rate. Many insurers require replacement before issuing a policy. Check the panel on your walkthrough.' });
    }

    var district = (C.ZIP_DISTRICT && C.ZIP_DISTRICT[zip]) ? C.ZIP_DISTRICT[zip] : null;
    if (district) {

  function buildCompareTriggers(results, down, C) {
    var out = [];

    var hotProps = results.filter(function(r) { return r.d.fw >= 50; });
    if (hotProps.length > 0) {
      var names = hotProps.map(function(r) { return r.label + ' ' + r.d.city; }).join(' and ');
      out.push(meTrigger('danger', '⚡',
        '<strong>' + names + '</strong> — hot market. Buyers sometimes waive inspection to compete. Understand the risk before you do.',
        'Waiving your inspection to win a bidding war means you own every problem the house has — no recourse after closing. A better approach is a short inspection period (5–7 days) rather than no inspection. <strong>Ask George before you waive anything.</strong>'
      ));
    }

    if (results.length >= 2) {
      var taxAmounts = results.map(function(r) { return r.m.tax; });
      var maxTax = Math.max.apply(null, taxAmounts);
      var minTax = Math.min.apply(null, taxAmounts);
      var gap = maxTax - minTax;
      if (gap > 100) {
        var highProp = results.filter(function(r) { return r.m.tax === maxTax; })[0];
        var lowProp  = results.filter(function(r) { return r.m.tax === minTax; })[0];
        out.push(meTrigger('caution', '🏛️',
          '<strong>Tax gap: ' + fmt$(gap) + '/month</strong> between ' + lowProp.label + ' ' + lowProp.d.city + ' and ' + highProp.label + ' ' + highProp.d.city + '. Same price, different county — real money.',
          'Property tax rates in the St. Louis metro range from 0.92% (St. Charles County) to 1.32% (Kirkwood). At the same home price, you can pay <strong>' + fmt$(gap) + ' more per month</strong> just by being in a different zip code. Over 30 years that is <strong>' + fmt$(gap*12*30) + '</strong>.'
        ));
      }
    }

    var cheapProps = results.filter(function(r) { return r.price < 150000; });
    if (cheapProps.length > 0) {
      out.push(meTrigger('danger', '🏦',
        '<strong>Financing risk below $150K:</strong> Lenders may require repairs before approving the loan — even after your offer is accepted.',
        'FHA and conventional loans require homes to meet minimum condition standards. Missing systems, exposed wiring, failed roofs, or significant structural issues can trigger repair requirements from the appraiser. <strong>At this price point, ask your lender what conditions would cause them to flag the appraisal before you make an offer.</strong>'
      ));
    }

    if (results.length >= 2) {
      var totals = results.map(function(r) { return r.m.total; });
      var thirtyGap = (Math.max.apply(null,totals) - Math.min.apply(null,totals)) * 12 * 30;
      if (thirtyGap > 40000) {
        out.push(meTrigger('tip', '📅',
          '<strong>' + fmt$(thirtyGap) + ' difference over 30 years</strong> between the most and least expensive option here. That is a car, a college fund, or a full renovation.',
          'The monthly cost difference between your cheapest and most expensive option compounds significantly over a 30-year mortgage. <strong>' + fmt$(Math.max.apply(null,totals) - Math.min.apply(null,totals)) + '/month</strong> may feel manageable — but ' + fmt$(thirtyGap) + ' over the life of the loan is real wealth.'
        ));
      }
    }

    var leverageProps = results.filter(function(r) { return r.d.fw < 30 && r.d.dom > 20; });
    if (leverageProps.length > 0) {
      var lnames = leverageProps.map(function(r) { return r.label + ' ' + r.d.city; }).join(', ');
      out.push(meTrigger('info', '🤝',
        '<strong>' + lnames + '</strong> — buyer leverage market. The data supports asking for concessions here.',
        'A first weekend rate under 30% with 20+ average days means sellers are not fielding multiple offers. Repair requests, closing cost contributions, and price reductions are realistic — not wishful thinking. <strong>In a leverage market, the prepared buyer wins.</strong>'
      ));
    }

    return out.join('');
  }

      if (zip && window.ZIP_DATA && window.ZIP_DATA[zip] && checklistState['p' + i + '_' + zip] && checklistState['p' + i + '_' + zip].eraId) {
        anySelected = true;
      }
    });
    var btn = _container.querySelector('#btn-gen-checklist');
    if (btn) btn.style.display = anySelected ? 'block' : 'none';
  }

  function generateChecklist() {
    var propList = [];
    properties.forEach(function(p, i) {
      var zipEl  = _container.querySelector('#p-zip-'  + i);
      var addrEl = _container.querySelector('#p-addr-' + i);
      var zip  = zipEl  ? zipEl.value  : '';
      var addr = addrEl ? addrEl.value : '';
      if (!zip || !window.ZIP_DATA || !window.ZIP_DATA[zip]) return;
      var propKey = 'p' + i + '_' + zip;
      var eraId = checklistState[propKey] ? checklistState[propKey].eraId : null;
      if (!eraId) return;
      propList.push({ zip:zip, addr:addr, idx:i, city:window.ZIP_DATA[zip].city, county:(window.STL_CALC && window.STL_CALC.ZIP_COUNTY[zip]) || '', eraId:eraId, propKey:propKey });
    });
    if (propList.length === 0) { alert('Select a build era for at least one property first.'); return; }
    var prompt = _container.querySelector('#checklist-era-prompt');
    var output = _container.querySelector('#checklist-output');
    if (prompt) prompt.style.display = 'none';
    if (output) {
      output.style.display = 'block';
      renderChecklistOutput(propList, output);
    }
    if (typeof gtag === 'function') gtag('event', 'checklist_generated', { prop_count: propList.length });
  }

  function renderChecklistOutput(propList, outputEl) {
    var html =
      '<div class="cmp-intro-box" style="margin-bottom:14px;">' +
        '<div class="cmp-intro-title">Use This Before You Go</div>' +
        '<div class="cmp-intro-sub">Tap each item, mark what you find, and get the budget range instantly. Items marked 🚩 are your negotiating points. Items marked ⚠️ are maintenance you need to budget for. Saved automatically to this device.</div>' +
      '</div>' +
      propList.map(function(p) { return renderPropChecklist(p); }).join('') +
      '<div class="cmp-cl-actions">' +
        '<button class="cmp-cl-action-btn cmp-cla-save" id="btn-cl-save">💾 Saved To Device</button>' +
        '<button class="cmp-cl-action-btn cmp-cla-email" id="btn-cl-email">📧 Email To Myself</button>' +
        '<button class="cmp-cl-action-btn cmp-cla-reset" id="btn-cl-reset">↺ Start Over</button>' +
      '</div>' +
      '<div class="cmp-data-source">Checklist saved on this device. It will be here when you get back from the showing.</div>';

    outputEl.innerHTML = html;
    var saveBtn  = outputEl.querySelector('#btn-cl-save');
    var emailBtn = outputEl.querySelector('#btn-cl-email');
    var resetBtn = outputEl.querySelector('#btn-cl-reset');
    if (saveBtn)  saveBtn.addEventListener('click',  function() { saveChecklistState(checklistState); var orig=saveBtn.textContent; saveBtn.textContent='✓ Saved'; setTimeout(function(){ saveBtn.textContent=orig; }, 1500); });
    if (emailBtn) emailBtn.addEventListener('click', function() { emailChecklist(propList); });
    if (resetBtn) resetBtn.addEventListener('click', function() {
      if (!confirm('Clear all checklist answers and start over?')) return;
      checklistState = {};
      saveChecklistState(checklistState);
      var prompt = _container.querySelector('#checklist-era-prompt');
      if (prompt) prompt.style.display = 'block';
      outputEl.style.display = 'none';
      buildEraSelectors();
    });
  }

  function renderPropChecklist(p) {
    var era = ERAS.filter(function(e) { return e.id === p.eraId; })[0];
    var items = getChecklistItems(p.eraId, p.county);
    var saved = checklistState[p.propKey] || {};
    var statuses = saved.items || {};

    var totalLow = 0, totalHigh = 0, flagCount = 0;
    items.forEach(function(item) {
      var s = statuses[item.id];
      if (s === 'flag' || s === 'warn') { totalLow += item.budget.low; totalHigh += item.budget.high; }
      if (s === 'flag') flagCount++;
    });

    return '<div class="cmp-cl-prop-block" id="clblock-' + p.propKey + '">' +
      '<div class="cmp-cl-prop-header">' +
        '<div class="cmp-clph-left">' +
          '<div class="cmp-clph-num" style="background:' + PROP_COLORS[p.idx] + ';">' + PROP_LABELS[p.idx] + '</div>' +
          '<div><div class="cmp-clph-title">' + p.zip + ' — ' + p.city + '</div>' +
          '<div class="cmp-clph-sub">' + (p.addr || p.county) + '</div></div>' +
        '</div>' +
        '<span class="cmp-cl-era-badge">' + (era ? era.label : '') + '</span>' +
      '</div>' +
      '<div class="cmp-cl-items">' +
        items.map(function(item) { return renderChecklistItem(item, p.propKey, statuses[item.id]); }).join('') +
      '</div>' +
      (totalLow > 0 ?
        '<div class="cmp-cl-summary">' +
          '<div><div class="cmp-cls-label">Flagged / Attention Items</div>' +
          '<div class="cmp-cls-total">$' + totalLow.toLocaleString() + ' – $' + totalHigh.toLocaleString() + '</div></div>' +
          (flagCount > 0 ? '<div class="cmp-cls-flags">🚩 ' + flagCount + ' item' + (flagCount > 1 ? 's' : '') + ' to negotiate</div>' : '') +
        '</div>'
      : '') +
    '</div>';
  }

  function renderChecklistItem(item, propKey, currentStatus) {
    var priCls = {critical:'pri-critical',high:'pri-high',medium:'pri-medium',low:'pri-low'};
    var budgetVisible = currentStatus === 'flag' || currentStatus === 'warn';
    if (!window._clItems) window._clItems = {};
    window._clItems[propKey + '_' + item.id] = item;
    return '<div class="cmp-cl-item' + (currentStatus ? ' open' : '') + '" id="cli-' + propKey + '-' + item.id + '">' +
      '<div class="cmp-cl-item-header" data-toggle="' + propKey + '|' + item.id + '">' +
        '<div class="cmp-cl-priority ' + (priCls[item.priority] || 'pri-low') + '"></div>' +
        '<div class="cmp-cl-item-text">' +
          '<div class="cmp-cl-item-name">' + item.name + '</div>' +
          '<div class="cmp-cl-item-desc">' + item.desc + '</div>' +
        '</div>' +
        '<div class="cmp-cl-item-expand">▼</div>' +
      '</div>' +
      '<div class="cmp-cl-status-wrap">' +
        '<div class="cmp-cl-status-prompt">📍 <strong>' + item.prompt + '</strong></div>' +
        '<div class="cmp-cl-status-tiles">' +
          '<div class="cmp-cst cmp-cst-ok'   + (currentStatus==='ok'   ? ' selected' : '') + '" data-status="ok|'   + propKey + '|' + item.id + '"><div class="cmp-cst-icon">✅</div><div class="cmp-cst-label">Looks Good</div></div>' +
          '<div class="cmp-cst cmp-cst-warn' + (currentStatus==='warn' ? ' selected' : '') + '" data-status="warn|' + propKey + '|' + item.id + '"><div class="cmp-cst-icon">⚠️</div><div class="cmp-cst-label">Attention</div></div>' +
          '<div class="cmp-cst cmp-cst-flag' + (currentStatus==='flag' ? ' selected' : '') + '" data-status="flag|' + propKey + '|' + item.id + '"><div class="cmp-cst-icon">🚩</div><div class="cmp-cst-label">Red Flag</div></div>' +
        '</div>' +
        '<div class="cmp-cl-budget' + (budgetVisible ? ' visible' : '') + '" id="clb-' + propKey + '-' + item.id + '">' +
          '<div class="cmp-cb-range">$' + item.budget.low.toLocaleString() + ' – $' + item.budget.high.toLocaleString() + '</div>' +
          (currentStatus==='flag' ? '<div class="cmp-cb-negotiate">🤝 Negotiate: ' + item.budget.negotiate + '</div>' : '') +
          (currentStatus==='warn' ? '<div class="cmp-cb-maintain">📅 Budget For: ' + item.budget.maintain + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function getChecklistItems(eraId, county) {
    return CHECKLIST_ITEMS.filter(function(item) {
      return item.era.indexOf(eraId) !== -1 && (item.county === 'all' || item.county === county);
    }).sort(function(a,b) {
      var order = {critical:0,high:1,medium:2,low:3};
      return order[a.priority] - order[b.priority];
    });
  }

  function setItemStatus(propKey, itemId, status) {
    var item = (window._clItems || {})[propKey + '_' + itemId];
    if (!item) return;
    if (!checklistState[propKey]) checklistState[propKey] = {};
    if (!checklistState[propKey].items) checklistState[propKey].items = {};
    checklistState[propKey].items[itemId] = status;
    saveChecklistState(checklistState);

    var wrap = document.getElementById('cli-' + propKey + '-' + itemId);
    if (!wrap) return;
    wrap.querySelectorAll('.cmp-cst').forEach(function(el) { el.classList.remove('selected'); });
    var selEl = wrap.querySelector('.cmp-cst-' + status);
    if (selEl) selEl.classList.add('selected');

    var budgetEl = document.getElementById('clb-' + propKey + '-' + itemId);
    if (budgetEl) {
      budgetEl.classList.toggle('visible', status === 'flag' || status === 'warn');
      budgetEl.innerHTML =
        '<div class="cmp-cb-range">$' + item.budget.low.toLocaleString() + ' – $' + item.budget.high.toLocaleString() + '</div>' +
        (status==='flag' ? '<div class="cmp-cb-negotiate">🤝 Negotiate: ' + item.budget.negotiate + '</div>' : '') +
        (status==='warn' ? '<div class="cmp-cb-maintain">📅 Budget For: ' + item.budget.maintain + '</div>' : '');
    }

    refreshPropSummary(propKey);
    if (typeof gtag === 'function') gtag('event', 'checklist_item_set', { propKey:propKey, itemId:itemId, status:status });
  }

  function refreshPropSummary(propKey) {
    var block = document.getElementById('clblock-' + propKey);
    if (!block) return;
    var statuses = (checklistState[propKey] && checklistState[propKey].items) ? checklistState[propKey].items : {};
    var parts = propKey.split('_');
    var idx = parseInt(parts[0].replace('p', ''));
    var zip = parts[1];
    var eraId = checklistState[propKey] ? checklistState[propKey].eraId : null;
    var county = (window.STL_CALC && window.STL_CALC.ZIP_COUNTY) ? (window.STL_CALC.ZIP_COUNTY[zip] || '') : '';
    if (!eraId) return;
    var items = getChecklistItems(eraId, county);
    var tLow = 0, tHigh = 0, flags = 0;
    items.forEach(function(item) {
      var s = statuses[item.id];
      if (s==='flag'||s==='warn') { tLow+=item.budget.low; tHigh+=item.budget.high; }
      if (s==='flag') flags++;
    });
    var summary = block.querySelector('.cmp-cl-summary');
    if (tLow > 0) {
      var html = '<div><div class="cmp-cls-label">Flagged / Attention Items</div><div class="cmp-cls-total">$' + tLow.toLocaleString() + ' – $' + tHigh.toLocaleString() + '</div></div>' +
        (flags > 0 ? '<div class="cmp-cls-flags">🚩 ' + flags + ' item' + (flags > 1 ? 's' : '') + ' to negotiate</div>' : '');
      if (summary) { summary.innerHTML = html; }
      else {
        var div = document.createElement('div');
        div.className = 'cmp-cl-summary';
        div.innerHTML = html;
        block.appendChild(div);
      }
    } else if (summary) { summary.remove(); }
  }

  function emailChecklist(propList) {
    var text = 'STL HOME BUYER CHECKLIST\n' + '═'.repeat(40) + '\nGenerated by George Kindler · The Closing Pros · 314.435.1087\n\n';
    propList.forEach(function(p) {
      var era = ERAS.filter(function(e) { return e.id === p.eraId; })[0];
      var items = getChecklistItems(p.eraId, p.county);
      var statuses = (checklistState[p.propKey] && checklistState[p.propKey].items) ? checklistState[p.propKey].items : {};
      text += PROP_LABELS[p.idx] + ' ' + p.zip + ' — ' + p.city + ' · ' + (era ? era.label : '') + '\n';
      if (p.addr) text += 'Address: ' + p.addr + '\n';
      text += '─'.repeat(36) + '\n';
      items.forEach(function(item) {
        var s = statuses[item.id];
        var icon = s==='ok'?'✅':s==='warn'?'⚠️':s==='flag'?'🚩':'○';
        text += icon + ' ' + item.name + '\n';
        if (s==='flag') text += '   Negotiate: $' + item.budget.low.toLocaleString() + '–$' + item.budget.high.toLocaleString() + '\n   ' + item.budget.negotiate + '\n';
        else if (s==='warn') text += '   Budget For: $' + item.budget.low.toLocaleString() + '–$' + item.budget.high.toLocaleString() + '\n';
      });
      text += '\n';
    });
    text += '─'.repeat(36) + '\nGeorge Kindler · The Closing Pros LLC · 314.435.1087\nLicensed Missouri Real Estate Agent · 13 Years';
    window.location.href = 'mailto:?subject=' + encodeURIComponent('Home Buyer Checklist — St. Louis Properties') + '&body=' + encodeURIComponent(text);
    if (typeof gtag === 'function') gtag('event', 'checklist_emailed');
  }

  function bindAll() {
    // Tab switching
    Array.prototype.forEach.call(_container.querySelectorAll('.cmp-tab-btn'), function(btn) {
      btn.addEventListener('click', function() { switchTab(btn.getAttribute('data-tab')); });
    });
    // Run comparison
    var runBtn = _container.querySelector('#btn-run-compare');
    if (runBtn) runBtn.addEventListener('click', runCompare);
    // Generate checklist
    var genBtn = _container.querySelector('#btn-gen-checklist');
    if (genBtn) genBtn.addEventListener('click', generateChecklist);

    // Delegate checklist item toggles and status clicks
    _container.addEventListener('click', function(e) {
      var toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        var parts = toggle.getAttribute('data-toggle').split('|');
        var el = document.getElementById('cli-' + parts[0] + '-' + parts[1]);
        if (el) el.classList.toggle('open');
        return;
      }
      var status = e.target.closest('[data-status]');
      if (status) {
        var sParts = status.getAttribute('data-status').split('|');
        setItemStatus(sParts[1], sParts[2], sParts[0]);
        return;
      }
    });
  }

  return {
    mount: function(container) {
      _container = container;
      checklistState = loadChecklistState();
      ZIP_OPTS = buildZipOpts();
      properties = [];
      container.innerHTML = buildHTML();
      bindAll();
      // Add 2 default property slots
      addProperty();
      addProperty();
      // Auto-fill from URL params
      var params = new URLSearchParams(window.location.search);
      var z1 = params.get('zip1'), pr1 = params.get('price1');
      var z2 = params.get('zip2'), pr2 = params.get('price2');
      if (z1 && window.ZIP_DATA && window.ZIP_DATA[z1]) {
        var s1 = container.querySelector('#p-zip-0');
        if (s1) { s1.value = z1; onZipChange(0); }
        if (pr1) { var p1 = container.querySelector('#p-price-0'); if (p1) p1.value = pr1; }
      }
      if (z2 && window.ZIP_DATA && window.ZIP_DATA[z2]) {
        var s2 = container.querySelector('#p-zip-1');
        if (s2) { s2.value = z2; onZipChange(1); }
        if (pr2) { var p2 = container.querySelector('#p-price-1'); if (p2) p2.value = pr2; }
      }
      if (z1 && z2) setTimeout(runCompare, 100);
    },
    unmount: function() {
      if (_container) _container.innerHTML = '';
      _container = null;
      properties = [];
    }
  };
})();
</script>

<script src="zip-data.js"></script>
<script src="resources.js"></script>
<script src="shared.js"></script>


<script>
(function () {
  function mountStandalone() {
    if (!window.TOOL_MODULES || !window.TOOL_MODULES['compare'] || !window.ZIP_DATA) {
      setTimeout(mountStandalone, 30); return;
    }
    if (!document.getElementById('tool-panel-body')) {
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:var(--bg);min-height:100vh;';
      document.body.appendChild(wrapper);
      window.TOOL_MODULES['compare'].mount(wrapper);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountStandalone);
  else mountStandalone();
})();
</script>
</body>
</html>
