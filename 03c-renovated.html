<!-- Cue tap wiring — fires after shared.js renders cues -->
<script>
(function () {
  'use strict';

  /*
    Wire cue tap logging into the shared.js cue system.
    shared.js renders cue buttons into .scene-cue-layer.
    We intercept those clicks and log the cue id.

    Each cue in the SCENES array has an id property.
    We match by position in the cues array for the current scene.
  */

  var _wiredScenes = {};

  function wireCueTaps(sceneIdx) {
    if (_wiredScenes[sceneIdx]) return;
    _wiredScenes[sceneIdx] = true;

    var scene = (window.SCENES || [])[sceneIdx];
    if (!scene || !scene.cues) return;

    var layer = document.getElementById('scene-cue-layer');
    if (!layer) return;

    var btns = layer.querySelectorAll('.scene-cue');
    var cueButtons = Array.prototype.filter.call(
      scene.cues,
      function(c) { return c.type === 'pulse' || c.type === 'badge'; }
    );

    Array.prototype.forEach.call(btns, function (btn, i) {
      var cue = cueButtons[i];
      if (!cue || !cue.id) return;
      btn.addEventListener('click', function () {
        logCueTap(cue.id);
      }, { once: false });
    });
  }

  /* Hook into shared.js scene render */
  var _origOnSceneRender = window.onSceneRender;
  window.onSceneRender = function (idx, scene) {
    if (_origOnSceneRender) _origOnSceneRender(idx, scene);
    setTimeout(function () { wireCueTaps(idx); }, 200);

    /* On summary scene — build results */
    if (idx === window.SCENES.length - 1) {
      setTimeout(buildSummary, 400);
    }
  };

  /* ── SUMMARY BUILDER ── */
  function buildSummary() {
    var allCues    = window.ALL_CUES || [];
    var tapped     = window.CUE_TAPPED || [];
    var total      = allCues.length;
    var tappedCount = tapped.length;
    var pct        = total > 0 ? Math.round((tappedCount / total) * 100) : 0;

    var missed = allCues.filter(function (c) {
      return tapped.indexOf(c.id) === -1;
    });

    /* Score tier */
    var tier, headline, sub;
    if (pct >= 80) {
      tier     = 'george';
      headline = 'You walked that house the way I do.';
      sub      = 'You caught ' + tappedCount + ' of ' + total + ' items. That\'s ' + pct + '%. You\'re ready to write an offer with your eyes open.';
    } else if (pct >= 50) {
      tier     = 'close';
      headline = 'You caught most of it.';
      sub      = 'You found ' + tappedCount + ' of ' + total + ' items (' + pct + '%). Here\'s what you almost missed:';
    } else {
      tier     = 'skipped';
      headline = 'Looks like you moved fast.';
      sub      = 'You caught ' + tappedCount + ' of ' + total + ' items (' + pct + '%). A few things worth going back for:';
    }

    /* Build result HTML */
    var missedHTML = '';
    if (missed.length && tier !== 'george') {
      missedHTML = '<div style="' +
        'margin:12px 0 0;' +
        'padding:12px 14px;' +
        'background:rgba(255,255,255,.03);' +
        'border:1px solid rgba(255,255,255,.08);' +
        'border-radius:10px;' +
      '">';
      missed.slice(0, 6).forEach(function (c) {
        missedHTML +=
          '<div style="' +
            'font-size:11px;' +
            'color:rgba(255,255,255,.6);' +
            'padding:4px 0;' +
            'border-bottom:1px solid rgba(255,255,255,.05);' +
          '">\u2014 ' + c.label + '</div>';
      });
      if (missed.length > 6) {
        missedHTML += '<div style="font-size:10px;color:rgba(255,204,77,.6);padding-top:6px;">+ ' + (missed.length - 6) + ' more</div>';
      }
      missedHTML += '</div>';
    }

    /* Score bar */
    var barColor = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
    var scoreHTML =
      '<div style="margin:16px 0 0;">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
          '<span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);">Walked like George</span>' +
          '<span style="font-size:12px;font-weight:700;color:' + barColor + ';">' + pct + '%</span>' +
        '</div>' +
        '<div style="height:4px;background:rgba(255,255,255,.08);border-radius:999px;">' +
          '<div style="height:100%;width:' + pct + '%;background:' + barColor + ';border-radius:999px;transition:width .6s ease;"></div>' +
        '</div>' +
      '</div>';

    /* Action buttons */
    var btnHTML =
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">';

    btnHTML +=
      '<button onclick="window.location.href=\'05-pre-offer.html\'" style="' +
        'width:100%;padding:14px;background:var(--gold);color:#080808;' +
        'border:none;border-radius:10px;font-size:13px;font-weight:800;' +
        'letter-spacing:.04em;cursor:pointer;font-family:var(--font-sans);' +
      '">Continue The Journey \u2192</button>';

    btnHTML +=
      '<button onclick="window.location.href=\'03-interior.html\'" style="' +
        'width:100%;padding:12px;background:transparent;color:rgba(255,255,255,.8);' +
        'border:1px solid rgba(255,255,255,.18);border-radius:10px;font-size:12px;' +
        'font-weight:700;cursor:pointer;font-family:var(--font-sans);' +
      '">Walk Another Home</button>';

    if (tier === 'skipped' || tier === 'close') {
      btnHTML +=
        '<button onclick="restartScenario()" style="' +
          'width:100%;padding:12px;background:transparent;color:rgba(255,255,255,.5);' +
          'border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:12px;' +
          'font-weight:600;cursor:pointer;font-family:var(--font-sans);' +
        '">Start Over \u2014 See What You Missed</button>';
    }

    btnHTML += '</div>';

    /* Inject into drawer */
    var choices = document.getElementById('choices');
    var label   = document.getElementById('drawer-label');

    if (label) label.textContent = headline;

    if (choices) {
      choices.innerHTML =
        '<div style="padding:0 0 4px;">' +
          '<div style="font-size:12px;color:rgba(255,255,255,.65);line-height:1.6;">' + sub + '</div>' +
          missedHTML +
          scoreHTML +
          btnHTML +
        '</div>';
    }
  }

  /* Restart from Scene 0 — clears cue state */
  window.restartScenario = function () {
    window.CUE_TAPPED = [];
    try {
      var s = JSON.parse(localStorage.getItem('stl_journey_v1') || '{}');
      s.renovatedCuesTapped = [];
      s.lastStep = 0;
      localStorage.setItem('stl_journey_v1', JSON.stringify(s));
    } catch(e) {}
    window.location.reload();
  };

})();
</script>
