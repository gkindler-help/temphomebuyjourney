<script>
(function () {
  'use strict';

  // ── GEORGE VISIBILITY CONTROL ──────────────────────────────────
  // George hidden by default via CSS.
  // Shown only on scenes with interrupt or on summary (scene 10).
  var GEORGE_SCENES = [0, 3, 4, 10]; // scenes with interrupt or summary

  function setGeorgeVisibility(sceneIdx) {
    var gf = document.getElementById('george-float');
    if (!gf) return;
    if (GEORGE_SCENES.indexOf(sceneIdx) !== -1) {
      gf.classList.add('george-visible');
    } else {
      gf.classList.remove('george-visible');
    }
  }

  // ── CUE TAP WIRING ─────────────────────────────────────────────
  var _wiredScenes = {};

  function wireCueTaps(sceneIdx) {
    if (_wiredScenes[sceneIdx]) return;
    _wiredScenes[sceneIdx] = true;

    var scene = (window.SCENES || [])[sceneIdx];
    if (!scene || !scene.cues) return;

    var layer = document.getElementById('scene-cue-layer');
    if (!layer) return;

    var pulseCues = scene.cues.filter(function (c) {
      return c.type === 'pulse' || c.type === 'badge';
    });

    var btns = layer.querySelectorAll('.scene-cue');
    Array.prototype.forEach.call(btns, function (btn, i) {
      var cue = pulseCues[i];
      if (!cue || !cue.id) return;
      btn.addEventListener('click', function () {
        logCueTap(cue.id);
      });
    });
  }

  // ── SCENE RENDER HOOK ──────────────────────────────────────────
  var _orig = window.onSceneRender;
  window.onSceneRender = function (idx, scene) {
    if (_orig) _orig(idx, scene);
    setGeorgeVisibility(idx);
    setTimeout(function () { wireCueTaps(idx); }, 200);

    // Summary scene
    if (idx === window.SCENES.length - 1) {
      setTimeout(buildSummary, 500);
    }
  };

  // ── SUMMARY ────────────────────────────────────────────────────
  function buildSummary() {
    var allCues    = window.ALL_CUES || [];
    var tapped     = window.CUE_TAPPED || [];
    var total      = allCues.length;
    var tappedCount = tapped.length;
    var pct        = total > 0 ? Math.round((tappedCount / total) * 100) : 0;

    var missed = allCues.filter(function (c) {
      return tapped.indexOf(c.id) === -1;
    });

    var headline, sub, barColor;
    if (pct >= 80) {
      headline = 'You walked it like George.';
      sub      = 'You caught ' + tappedCount + ' of ' + total + ' items. You\'re ready to talk about what you saw.';
      barColor = 'var(--green)';
    } else if (pct >= 50) {
      headline = 'You caught most of it.';
      sub      = tappedCount + ' of ' + total + ' items. Here\'s what you almost missed:';
      barColor = 'var(--gold)';
    } else {
      headline = 'Looks like you moved fast.';
      sub      = tappedCount + ' of ' + total + ' items. Want to go back and see what you missed?';
      barColor = 'var(--red)';
    }

    var missedHTML = '';
    if (missed.length && pct < 80) {
      missedHTML = '<div style="margin:10px 0 0;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;">';
      missed.slice(0, 6).forEach(function (c) {
        missedHTML += '<div style="font-size:11px;color:rgba(255,255,255,.55);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);">\u2014 ' + c.label + '</div>';
      });
      if (missed.length > 6) {
        missedHTML += '<div style="font-size:10px;color:rgba(255,204,77,.55);padding-top:5px;">+ ' + (missed.length - 6) + ' more</div>';
      }
      missedHTML += '</div>';
    }

    var scoreHTML =
      '<div style="margin:14px 0 0;">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:5px;">' +
          '<span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);">Walked like George</span>' +
          '<span style="font-size:12px;font-weight:700;color:' + barColor + ';">' + pct + '%</span>' +
        '</div>' +
        '<div style="height:4px;background:rgba(255,255,255,.07);border-radius:999px;">' +
          '<div style="height:100%;width:' + pct + '%;background:' + barColor + ';border-radius:999px;"></div>' +
        '</div>' +
      '</div>';

    var btnHTML = '<div style="display:flex;flex-direction:column;gap:8px;margin-top:18px;">';
    btnHTML += '<button onclick="window.location.href=\'05-pre-offer.html\'" style="width:100%;padding:14px;background:var(--gold);color:#080808;border:none;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:.04em;cursor:pointer;font-family:var(--font-sans);">Continue The Journey \u2192</button>';
    btnHTML += '<button onclick="window.location.href=\'03-interior.html\'" style="width:100%;padding:12px;background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-sans);">Walk Another Home</button>';
    if (pct < 80) {
      btnHTML += '<button onclick="window.restartScenario()" style="width:100%;padding:12px;background:transparent;color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.09);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);">Start Over \u2014 See What You Missed</button>';
    }
    btnHTML += '</div>';

    var label   = document.getElementById('drawer-label');
    var choices = document.getElementById('choices');
    if (label)   label.textContent = headline;
    if (choices) choices.innerHTML =
      '<div style="padding:0 0 4px;">' +
        '<div style="font-size:12px;color:rgba(255,255,255,.6);line-height:1.6;">' + sub + '</div>' +
        missedHTML + scoreHTML + btnHTML +
      '</div>';
  }

  window.restartScenario = function () {
    window.CUE_TAPPED = [];
    try {
      var s = JSON.parse(localStorage.getItem('stl_journey_v1') || '{}');
      s.renovatedCuesTapped = [];
      s.lastStep = 0;
      localStorage.setItem('stl_journey_v1', JSON.stringify(s));
    } catch(e) {}
    window.location.reload();
  };

})();
</script>

</body>
</html>
