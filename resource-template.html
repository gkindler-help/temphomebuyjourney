<div id="app"></div>

<script>
/* ── RESOURCE IDENTITY ── */
/* Match this id to your entry in resources.js */
window.RESOURCE_ID    = 'your-resource-id';
window.CHAPTER_NUM    = 0;   /* 0 = resource page, not a journey chapter */
window.CHAPTER_LABEL  = '[Resource Title]';
window.PREV_FILE      = 'index.html';

/* ── NAMED SECTIONS ──
   Must match entrySection values in resources.js citations.
   shared.js uses these to scroll/navigate to the right section on entry. */
window.RESOURCE_SECTIONS = [
  'overview',
  'section-two',
  'section-three'
];

/* ── PHOTOS ── */
var PHOTOS = {
  hero: 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=900&q=85'
  /* Add more as needed */
};

/* ── SCENES ──
   Same format as journey chapters.
   Each scene can have: bg, george, room, title, sub, choices, isLast, nextFile.
   Resource pages navigate back to the journey on isLast using PREV_FILE. */
window.SCENES = [

  /* 0 — OVERVIEW */
  {
    id:     'overview',
    bg:     PHOTOS.hero,
    george: 'explaining',
    room:   '[Short Label]',
    title:  '[Scene title — what the buyer is about to learn]',
    sub:    '[George\'s framing — 1-2 sentences, direct and protective tone]',
    choices: [
      {
        label:    '[First question]',
        response: '[Direct answer — no hedging. What George actually thinks.]',
        deep: {
          title: '[Deep dive title]',
          body:  '[Full explanation — technical detail, St. Louis-specific context, what most agents won\'t say]'
        }
      },
      {
        label:    '[Second question]',
        response: '[Direct answer]'
      }
    ]
  },

  /* 1 — SECTION TWO */
  {
    id:     'section-two',
    bg:     PHOTOS.hero,
    george: 'serious',
    room:   '[Label]',
    title:  '[Title]',
    sub:    '[Sub]',
    choices: [
      {
        label:    '[Question]',
        response: '[Answer]'
      }
    ]
  },

  /* LAST SCENE — returns buyer to journey */
  {
    id:     'section-three',
    bg:     PHOTOS.hero,
    george: 'proud',
    room:   'You\'re Informed',
    title:  '[Closing statement — what they now know]',
    sub:    '[What they should do next with this information]',
    choices: [],
    isLast:    true,
    nextLabel: 'Back to Journey \u2192',
    nextFile:  'index.html',
    nextChapter: 0
  }

];
</script>
